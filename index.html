const BOOKS=RAW.map((b,i)=>({id:i+1,...b}));
const N=BOOKS.length;

// ── CANVAS ──
const gc=document.getElementById('gc');
const uc=document.getElementById('uc');
const gx=gc.getContext('2d');
const ux=uc.getContext('2d');
let W,H;
function resize(){W=gc.width=uc.width=window.innerWidth;H=gc.height=uc.height=window.innerHeight;}
window.addEventListener('resize',()=>{resize();if(!introActive)buildLayout();});
resize();

// ── CAMERA ──
let camX=0,camY=0,zoom=1;
let targetCamX=0,targetCamY=0,targetZoom=1;
function w2s(wx,wy){return{x:(wx+camX)*zoom+W/2,y:(wy+camY)*zoom+H/2};}
function s2w(sx,sy){return{x:(sx-W/2)/zoom-camX,y:(sy-H/2)/zoom-camY};}

// ── NODES ──
// Center node = search engine
const centerNode={id:'center',x:0,y:0,vx:0,vy:0,isCenter:true};
// Category nodes arranged in circle around center
const CAT_R=200;
const catNodes=CATS.map((cat,i)=>{
  const angle=(i/CATS.length)*Math.PI*2-Math.PI/2;
  return{id:'cat_'+cat,cat,x:Math.cos(angle)*CAT_R,y:Math.sin(angle)*CAT_R,vx:0,vy:0,isCat:true,label:cat.toLowerCase()};
});
// Book nodes
const bookNodes=BOOKS.map((b,i)=>({id:'book_'+b.id,book:b,x:0,y:0,vx:0,vy:0,isBook:true}));

function buildLayout(){
  // Place book nodes around their category node
  catNodes.forEach(cn=>{
    const books=bookNodes.filter(bn=>bn.book.cat===cn.cat);
    const angleStep=(Math.PI*2)/books.length;
    const baseAngle=Math.atan2(cn.y,cn.x);
    books.forEach((bn,i)=>{
      const a=baseAngle+(i-(books.length-1)/2)*angleStep*0.55;
      const r=80+Math.random()*60;
      bn.x=cn.x+Math.cos(a)*r+(Math.random()-0.5)*30;
      bn.y=cn.y+Math.sin(a)*r+(Math.random()-0.5)*30;
      bn.vx=0;bn.vy=0;
    });
  });
}
buildLayout();

// All nodes for physics
function allNodes(){return[centerNode,...catNodes,...bookNodes];}

// ── PHYSICS ──
const DAMP=0.72,BOOK_REPEL=900,BOOK_ATTRACT=0.028,CAT_BOOK_IDEAL=100,CENTER_CAT_IDEAL=CAT_R;
let simStep=0;

function simulate(){
  // Repulsion between book nodes
  for(let i=0;i<bookNodes.length;i++){
    for(let j=i+1;j<bookNodes.length;j++){
      const a=bookNodes[i],b=bookNodes[j];
      if(a.book.cat!==b.book.cat)continue;
      const dx=a.x-b.x,dy=a.y-b.y;
      const d2=Math.max(dx*dx+dy*dy,1);
      if(d2>120*120)continue;
      const f=BOOK_REPEL/d2,inv=1/Math.sqrt(d2);
      a.vx+=dx*inv*f;a.vy+=dy*inv*f;
      b.vx-=dx*inv*f;b.vy-=dy*inv*f;
    }
  }
  // Attraction: book → its cat node
  bookNodes.forEach(bn=>{
    const cn=catNodes.find(c=>c.cat===bn.book.cat);
    if(!cn)return;
    const dx=cn.x-bn.x,dy=cn.y-bn.y;
    const d=Math.sqrt(dx*dx+dy*dy)+0.01;
    const f=(d-CAT_BOOK_IDEAL)*BOOK_ATTRACT;
    bn.vx+=(dx/d)*f;bn.vy+=(dy/d)*f;
  });
  // Cat nodes stay in place (fixed)
  // Integrate books only
  bookNodes.forEach(n=>{n.vx*=DAMP;n.vy*=DAMP;n.x+=n.vx;n.y+=n.vy;});
}

// ── INTRO ──
let introActive=true,introPhase=0,introT=0;
const JOSIAH="JOSIAH PRINCE GOMEZ";
const JL=JOSIAH.length;
const iLetters=[];
const iName=[];

function buildIntro(){
  iLetters.length=0;iName.length=0;
  // Fill screen with first + last initial of each book
  const books=[...BOOKS].sort(()=>Math.random()-0.5);
  const cols=Math.ceil(Math.sqrt(books.length*2.2));
  const rows=Math.ceil(books.length/cols)+2;
  const marginX=0.06*W,marginY=0.08*H;
  const spacingX=(W-marginX*2)/(cols-1);
  const spacingY=(H-marginY*2)/(rows-1);
  // Reserve center row for JOSIAH
  const centerRow=Math.floor(rows/2);
  const nameStartCol=Math.floor((cols-JL)/2);
  const usedCells=new Set();
  for(let k=0;k<JL;k++)usedCells.add(`${centerRow},${nameStartCol+k}`);

  books.forEach((b,idx)=>{
    const author=b.author==='N/A'?b.title:b.author;
    const parts=author.trim().split(/\s+/);
    const first=parts[0][0]?parts[0][0].toUpperCase():'?';
    const last=parts.length>1?parts[parts.length-1][0].toUpperCase():first;
    const chars=[first,last].filter((c,i,a)=>a.indexOf(c)===i); // dedupe
    chars.forEach((ch,ci)=>{
      let placed=false;
      for(let attempt=0;attempt<200&&!placed;attempt++){
        const col=Math.floor(Math.random()*cols);
        const row=Math.floor(Math.random()*rows);
        if(!usedCells.has(`${row},${col}`)){
          usedCells.add(`${row},${col}`);
          const sx=marginX+col*spacingX+(Math.random()-0.5)*spacingX*0.3;
          const sy=marginY+row*spacingY+(Math.random()-0.5)*spacingY*0.3;
          const ni=bookNodes.findIndex(n=>n.id==='book_'+b.id);
          iLetters.push({ch,sx,sy,nodeIdx:ni,cat:b.cat,alpha:0,born:Math.random()*0.3});
          placed=true;
        }
      }
    });
  });

  // JOSIAH letters in center — spread across middle row
  JOSIAH.split('').forEach((ch,i)=>{
    const col=nameStartCol+i;
    const sx=marginX+col*spacingX;
    const sy=marginY+centerRow*spacingY;
    iName.push({ch,sx,sy,alpha:0,born:i*0.04});
  });
}

function drawIntro(){
  gx.clearRect(0,0,W,H);ux.clearRect(0,0,W,H);
  const t=introT;

  if(introPhase===0){
    // Phase 0: all letters fade in (0→1s)
    iLetters.forEach(l=>{
      const ta=Math.max(0,(t-l.born)/0.6);
      l.alpha=Math.min(ta,1);
      if(l.alpha<0.01)return;
      gx.font=`12px 'Courier New',monospace`;
      gx.textAlign='center';
      gx.fillStyle=`rgba(255,255,255,${l.alpha*0.38})`;
      gx.fillText(l.ch,l.sx,l.sy);
    });
    // JOSIAH name builds in from left
    iName.forEach(l=>{
      const ta=Math.max(0,(t-0.4-l.born)/0.5);
      l.alpha=Math.min(ta,1);
      if(l.alpha<0.01)return;
      gx.font=`bold 14px 'Courier New',monospace`;
      gx.textAlign='center';
      gx.fillStyle=`rgba(220,50,50,${l.alpha})`;
      gx.fillText(l.ch,l.sx,l.sy);
    });
    if(t>2.5)introPhase=1,introT=0;

  } else if(introPhase===1){
    // Phase 1: hold all letters for 0.5s then name stays 1s longer
    const bookFade=Math.max(0,Math.min(1,(t-0.3)/0.6));
    iLetters.forEach(l=>{
      const al=(1-bookFade)*l.alpha*0.38;
      if(al<0.01)return;
      gx.font=`12px 'Courier New',monospace`;
      gx.textAlign='center';
      gx.fillStyle=`rgba(255,255,255,${al})`;
      gx.fillText(l.ch,l.sx,l.sy);
    });
    const nameFade=Math.max(0,Math.min(1,(t-1.3)/0.5));
    iName.forEach(l=>{
      const al=(1-nameFade);
      if(al<0.01)return;
      gx.font=`bold 14px 'Courier New',monospace`;
      gx.textAlign='center';
      gx.fillStyle=`rgba(220,50,50,${al})`;
      gx.fillText(l.ch,l.sx,l.sy);
    });
    if(t>2.0){introPhase=2;introT=0;}

  } else if(introPhase===2){
    // Phase 2: letters fly to their node positions, dots emerge
    const ease=t<1?t*t*(3-2*t):1;
    iLetters.forEach(l=>{
      if(l.nodeIdx<0)return;
      const tn=bookNodes[l.nodeIdx];
      const ts=w2s(tn.x,tn.y);
      const cx=l.sx+(ts.x-l.sx)*ease;
      const cy=l.sy+(ts.y-l.sy)*ease;
      const letterAl=(1-ease)*0.38;
      if(letterAl>0.02){
        gx.font=`${Math.max(12*(1-ease*0.8),4)}px 'Courier New',monospace`;
        gx.textAlign='center';
        gx.fillStyle=`rgba(255,255,255,${letterAl})`;
        gx.fillText(l.ch,cx,cy);
      }
      if(ease>0.3){
        const da=(ease-0.3)/0.7;
        const col=CAT_COLORS[l.cat]||'#fff';
        gx.fillStyle=hexA(col,da*0.8);
        gx.beginPath();gx.arc(cx,cy,Math.max(ease*4,1.5),0,Math.PI*2);gx.fill();
      }
    });
    if(ease>=1){introActive=false;}
  }

  // cursor
  ux.fillStyle='rgba(255,255,255,0.85)';
  ux.beginPath();ux.arc(mouseX,mouseY,4,0,Math.PI*2);ux.fill();
}

// ── DRAW GRAPH ──
let hoveredBook=null,selectedBook=null,focusedCat=null;
let hoveredCat=null;

function hexA(hex,a){
  const n=parseInt(hex.replace('#',''),16);
  return`rgba(${(n>>16)&0xff},${(n>>8)&0xff},${n&0xff},${a})`;
}

function getConnectedBooks(bn){
  // Books connected: same sub, or same author
  const b=bn.book;
  return bookNodes.filter(other=>{
    if(other===bn)return false;
    return other.book.sub===b.sub||(b.author!=='N/A'&&other.book.author===b.author);
  });
}

function drawGraph(){
  gx.clearRect(0,0,W,H);

  const filteredBooks=focusedCat?bookNodes.filter(bn=>bn.book.cat===focusedCat):bookNodes;
  const visibleCatNodes=focusedCat?catNodes.filter(c=>c.cat===focusedCat):catNodes;

  // ── EDGES ──
  // Center → cat nodes
  if(!focusedCat){
    catNodes.forEach(cn=>{
      const sc=w2s(centerNode.x,centerNode.y);
      const sn=w2s(cn.x,cn.y);
      const col=CAT_COLORS[cn.cat];
      const g=gx.createLinearGradient(sc.x,sc.y,sn.x,sn.y);
      g.addColorStop(0,hexA(col,0.35));g.addColorStop(1,hexA(col,0.08));
      gx.strokeStyle=g;gx.lineWidth=1.2;
      gx.beginPath();gx.moveTo(sc.x,sc.y);gx.lineTo(sn.x,sn.y);gx.stroke();
    });
  }

  // Cat → book edges
  filteredBooks.forEach(bn=>{
    const cn=catNodes.find(c=>c.cat===bn.book.cat);
    if(!cn)return;
    const sc=w2s(cn.x,cn.y);
    const sb=w2s(bn.x,bn.y);
    const col=CAT_COLORS[bn.book.cat];
    const isHovConn=hoveredBook&&getConnectedBooks(hoveredBook).includes(bn);
    const isHovSelf=hoveredBook===bn;
    const al=isHovSelf?0.7:isHovConn?0.5:(hoveredBook?0.04:0.15);
    const lw=isHovConn||isHovSelf?1.5:0.6;
    const g=gx.createLinearGradient(sc.x,sc.y,sb.x,sb.y);
    g.addColorStop(0,hexA(col,al));g.addColorStop(1,hexA(col,al*0.5));
    gx.strokeStyle=g;gx.lineWidth=lw;
    gx.beginPath();gx.moveTo(sc.x,sc.y);gx.lineTo(sb.x,sb.y);gx.stroke();
    // Connected book→book edges on hover
    if(isHovConn&&hoveredBook){
      const sh=w2s(hoveredBook.x,hoveredBook.y);
      gx.strokeStyle=hexA(col,0.3);gx.lineWidth=0.6;
      gx.setLineDash([3,4]);
      gx.beginPath();gx.moveTo(sh.x,sh.y);gx.lineTo(sb.x,sb.y);gx.stroke();
      gx.setLineDash([]);
    }
  });

  // ── BOOK NODES ──
  filteredBooks.forEach(bn=>{
    const s=w2s(bn.x,bn.y);
    if(s.x<-40||s.x>W+40||s.y<-40||s.y>H+40)return;
    const col=CAT_COLORS[bn.book.cat];
    const isHov=hoveredBook===bn,isSel=selectedBook===bn;
    const isConn=hoveredBook&&!isHov&&getConnectedBooks(hoveredBook).includes(bn);
    const r=(isSel?7:isHov?6.5:isConn?5:4)*Math.min(zoom*1.1,2);
    const al=isHov||isSel?1:isConn?0.9:(hoveredBook?0.25:0.75);
    if(isHov||isSel||isConn){
      const g=gx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*5);
      g.addColorStop(0,hexA(col,isHov||isSel?0.45:0.2));g.addColorStop(1,'transparent');
      gx.fillStyle=g;gx.beginPath();gx.arc(s.x,s.y,r*5,0,Math.PI*2);gx.fill();
    }
    gx.fillStyle=hexA(col,al);
    gx.beginPath();gx.arc(s.x,s.y,r,0,Math.PI*2);gx.fill();
    if(isSel){gx.strokeStyle=col;gx.lineWidth=1.5;gx.beginPath();gx.arc(s.x,s.y,r+5,0,Math.PI*2);gx.stroke();}

    // Label on hover
    if(isHov||isSel){
      gx.font=`${isSel?11:9.5}px 'Courier New',monospace`;gx.textAlign='left';
      const lbl=bn.book.title;
      const tw=gx.measureText(lbl).width;
      const lx=s.x+r+5,ly=s.y+4;
      gx.fillStyle='rgba(0,0,0,0.9)';gx.fillRect(lx-3,ly-11,tw+6,16);
      gx.fillStyle='rgba(255,255,255,0.9)';gx.fillText(lbl,lx,ly);
    }
    // Show connected book titles on hover
    if(isConn&&hoveredBook){
      const lbl=bn.book.title.slice(0,25)+(bn.book.title.length>25?'…':'');
      gx.font=`8.5px 'Courier New',monospace`;gx.textAlign='left';
      const tw=gx.measureText(lbl).width;
      const lx=s.x+r+4,ly=s.y+3;
      gx.fillStyle='rgba(0,0,0,0.7)';gx.fillRect(lx-2,ly-9,tw+4,13);
      gx.fillStyle=hexA(col,0.85);gx.fillText(lbl,lx,ly);
    }
  });

  // ── CAT NODES ──
  visibleCatNodes.forEach(cn=>{
    const s=w2s(cn.x,cn.y);
    const col=CAT_COLORS[cn.cat];
    const isHov=hoveredCat===cn.id,isFoc=focusedCat===cn.cat;
    const r=(isFoc?14:isHov?13:10)*Math.min(zoom,1.5);
    const g=gx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*5);
    g.addColorStop(0,hexA(col,isHov||isFoc?0.45:0.25));g.addColorStop(1,'transparent');
    gx.fillStyle=g;gx.beginPath();gx.arc(s.x,s.y,r*5,0,Math.PI*2);gx.fill();
    gx.fillStyle=col;gx.beginPath();gx.arc(s.x,s.y,r,0,Math.PI*2);gx.fill();
    // Label
    gx.font=`bold ${Math.round(10*Math.min(zoom,1.4))}px 'Courier New',monospace`;
    gx.textAlign='center';
    gx.fillStyle=isHov||isFoc?'rgba(255,255,255,0.92)':'rgba(255,255,255,0.5)';
    gx.fillText(isFoc?'↩ return':cn.label,s.x,s.y-r-8);
  });

  // ── CENTER NODE ──
  if(!focusedCat){
    const sc=w2s(centerNode.x,centerNode.y);
    const r=12*Math.min(zoom,1.5);
    const g=gx.createRadialGradient(sc.x,sc.y,0,sc.x,sc.y,r*4);
    g.addColorStop(0,'rgba(255,255,255,0.3)');g.addColorStop(1,'transparent');
    gx.fillStyle=g;gx.beginPath();gx.arc(sc.x,sc.y,r*4,0,Math.PI*2);gx.fill();
    gx.fillStyle='rgba(255,255,255,0.85)';
    gx.beginPath();gx.arc(sc.x,sc.y,r,0,Math.PI*2);gx.fill();
    gx.font=`9px 'Courier New',monospace`;gx.textAlign='center';
    gx.fillStyle='rgba(255,255,255,0.45)';
    gx.fillText('search',sc.x,sc.y+r+14);
  }

  document.getElementById('counter').textContent=focusedCat?`${filteredBooks.length} / ${N} — ${focusedCat.toLowerCase()}`:`${N} / jo's library`;
}

// ── CURSOR + UI CANVAS ──
let mouseX=W/2,mouseY=H/2;
window.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;});

function drawCursor(){
  ux.clearRect(0,0,W,H);
  if(!introActive){
    // Lines to nearest 5 dots
    const REACH=140,COUNT=5;
    const all=focusedCat?bookNodes.filter(bn=>bn.book.cat===focusedCat):bookNodes;
    const cands=[];
    all.forEach(bn=>{
      const s=w2s(bn.x,bn.y);
      const d=Math.hypot(s.x-mouseX,s.y-mouseY);
      if(d<REACH)cands.push({d,s});
    });
    cands.sort((a,b)=>a.d-b.d);
    cands.slice(0,COUNT).forEach(c=>{
      ux.strokeStyle=`rgba(255,255,255,${0.18*(1-c.d/REACH)})`;
      ux.lineWidth=0.5;
      ux.beginPath();ux.moveTo(mouseX,mouseY);ux.lineTo(c.s.x,c.s.y);ux.stroke();
    });
    // Hover detection
    const wm=s2w(mouseX,mouseY);const HR=14/zoom;
    let bestBook=null,bd=Infinity;
    bookNodes.forEach(bn=>{
      const ok=!focusedCat||bn.book.cat===focusedCat;
      if(!ok)return;
      const d=Math.hypot(bn.x-wm.x,bn.y-wm.y);
      if(d<HR&&d<bd){bd=d;bestBook=bn;}
    });
    hoveredBook=bestBook;
    let bestCat=null,bcd=Infinity;
    catNodes.forEach(cn=>{
      const ok=!focusedCat||cn.cat===focusedCat;
      if(!ok)return;
      const d=Math.hypot(cn.x-wm.x,cn.y-wm.y);
      if(d<18/zoom&&d<bcd){bcd=d;bestCat=cn.id;}
    });
    hoveredCat=bestCat;
  }
  // Cursor dot
  ux.fillStyle='rgba(255,255,255,0.9)';
  ux.beginPath();ux.arc(mouseX,mouseY,4,0,Math.PI*2);ux.fill();
  ux.strokeStyle='rgba(255,255,255,0.22)';ux.lineWidth=0.8;
  ux.beginPath();ux.arc(mouseX,mouseY,7,0,Math.PI*2);ux.stroke();
}

// ── LOOP ──
let last=Date.now();
function loop(){
  const now=Date.now();
  const dt=(now-last)/1000;last=now;
  if(introActive){
    introT+=dt;
    drawIntro();
  } else {
    // Lerp camera
    camX+=(targetCamX-camX)*0.08;
    camY+=(targetCamY-camY)*0.08;
    zoom+=(targetZoom-zoom)*0.06;
    if(simStep<800)simulate();
    simStep++;
    drawGraph();
  }
  drawCursor();
  requestAnimationFrame(loop);
}

buildIntro();
loop();

// ── INTERACTION ──
let isDrag=false,lastMX2=0,lastMY2=0,dragMoved=false;
uc.addEventListener('mousedown',e=>{isDrag=true;lastMX2=e.clientX;lastMY2=e.clientY;dragMoved=false;});
gc.addEventListener('mousedown',e=>{isDrag=true;lastMX2=e.clientX;lastMY2=e.clientY;dragMoved=false;});
window.addEventListener('mousemove',e=>{
  if(isDrag){
    const dx=e.clientX-lastMX2,dy=e.clientY-lastMY2;
    targetCamX+=dx/zoom;targetCamY+=dy/zoom;
    lastMX2=e.clientX;lastMY2=e.clientY;
    if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;
  }
});
window.addEventListener('mouseup',e=>{
  if(!isDrag)return;isDrag=false;
  if(dragMoved){dragMoved=false;return;}
  // Click center node
  const wm=s2w(e.clientX,e.clientY);
  if(!focusedCat&&Math.hypot(centerNode.x-wm.x,centerNode.y-wm.y)<18/zoom){openSearch();return;}
  // Click cat node
  for(const cn of catNodes){
    if(Math.hypot(cn.x-wm.x,cn.y-wm.y)<18/zoom){
      if(focusedCat===cn.cat){returnToFull();}
      else{focusCat(cn.cat);}
      return;
    }
  }
  // Click book node
  if(hoveredBook){openBook(hoveredBook);return;}
  // Click elsewhere: close card
  if(document.getElementById('detailCard').classList.contains('open'))closeCard();
  dragMoved=false;
});
window.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:0.9;
  const wx=(e.clientX-W/2)/zoom-camX,wy=(e.clientY-H/2)/zoom-camY;
  targetZoom=Math.max(0.15,Math.min(8,targetZoom*f));
  targetCamX=(e.clientX-W/2)/targetZoom-wx;
  targetCamY=(e.clientY-H/2)/targetZoom-wy;
},{passive:false});
document.getElementById('zi').onclick=()=>targetZoom=Math.min(8,targetZoom*1.25);
document.getElementById('zo').onclick=()=>targetZoom=Math.max(0.15,targetZoom/1.25);

// ── FOCUS CAT ──
function focusCat(cat){
  focusedCat=cat;closeCard();
  // Rearrange books of this cat in a nice circular pattern around cat node
  const cn=catNodes.find(c=>c.cat===cat);
  const books=bookNodes.filter(bn=>bn.book.cat===cat);
  const angleStep=(Math.PI*2)/books.length;
  books.forEach((bn,i)=>{
    const a=i*angleStep;
    const r=90+Math.random()*50;
    bn.x=cn.x+Math.cos(a)*r;bn.y=cn.y+Math.sin(a)*r;bn.vx=0;bn.vy=0;
  });
  // Zoom to this cat
  targetCamX=-cn.x;targetCamY=-cn.y;targetZoom=1.8;
  document.getElementById('returnBtn').style.display='block';
  simStep=0;
}

function returnToFull(){
  focusedCat=null;
  targetCamX=0;targetCamY=0;targetZoom=1;
  document.getElementById('returnBtn').style.display='none';
  closeCard();
}
document.getElementById('returnBtn').onclick=returnToFull;

// Touch
let tSX=0,tSY=0,tD=false;
uc.addEventListener('touchstart',e=>{tSX=e.touches[0].clientX;tSY=e.touches[0].clientY;tD=false;lastMX2=tSX;lastMY2=tSY;},{passive:true});
uc.addEventListener('touchmove',e=>{const dx=e.touches[0].clientX-lastMX2,dy=e.touches[0].clientY-lastMY2;targetCamX+=dx/zoom;targetCamY+=dy/zoom;lastMX2=e.touches[0].clientX;lastMY2=e.touches[0].clientY;tD=true;mouseX=lastMX2;mouseY=lastMY2;},{passive:true});
uc.addEventListener('touchend',e=>{
  if(!tD){
    const t=e.changedTouches[0],wm=s2w(t.clientX,t.clientY);
    if(!focusedCat&&Math.hypot(centerNode.x-wm.x,centerNode.y-wm.y)<18/zoom){openSearch();return;}
    for(const cn of catNodes){if(Math.hypot(cn.x-wm.x,cn.y-wm.y)<18/zoom){focusedCat===cn.cat?returnToFull():focusCat(cn.cat);return;}}
    for(const bn of bookNodes){const ok=!focusedCat||bn.book.cat===focusedCat;if(ok&&Math.hypot(bn.x-wm.x,bn.y-wm.y)<14/zoom){openBook(bn);return;}}
  }
});

// ── BOOK DETAIL ──
let currentBookId=null;const sessionLoans={};
function loadLoans(){try{return JSON.parse(localStorage.getItem(LOANS_KEY)||'[]');}catch{return[];}}
function isOnLoan(title){return loadLoans().some(l=>{const due=new Date(l.date);due.setDate(due.getDate()+14);const now=new Date();now.setHours(0,0,0,0);due.setHours(0,0,0,0);return l.title===title&&Math.round((due-now)/86400000)>0;});}

function openBook(bn){
  const b=bn.book;selectedBook=bn;currentBookId=b.id;
  document.getElementById('dcI').innerHTML=`<span class="ddot" style="background:${CAT_COLORS[b.cat]}"></span>${b.id} / ${N}`;
  document.getElementById('dcT').textContent=b.title;
  document.getElementById('dcC').textContent=`${b.cat} · ${b.sub}`;
  document.getElementById('dcA').textContent=b.author==='N/A'?'':b.author;
  document.getElementById('dcG').textContent=b.tags;
  const connected=getConnectedBooks(bn).slice(0,6);
  const rw=document.getElementById('dcRel');
  rw.innerHTML=`<div class="drlb">${connected.length?'connected books':''}</div>`;
  connected.forEach(r=>{const t=document.createElement('span');t.className='drt';t.textContent=r.book.title.slice(0,30);t.onclick=()=>{const nb=bookNodes.find(x=>x===r);if(nb)openBook(nb);};rw.appendChild(t);});
  const lb=document.getElementById('loanBtn');
  const onLoan=isOnLoan(b.title)||sessionLoans[b.id];
  lb.textContent=onLoan?'on loan':'loan';lb.className=onLoan?'lbtn onloan':'lbtn';lb.disabled=!!onLoan;
  const q=encodeURIComponent(b.title+' '+(b.author==='N/A'?'':b.author));
  document.getElementById('grBtn').href=`https://www.goodreads.com/search?q=${q}`;
  document.getElementById('lmTitle').textContent=b.title;
  targetCamX=-bn.x;targetCamY=-bn.y;
  document.getElementById('dim').classList.add('on');
  document.getElementById('detailCard').classList.add('open');
}
function closeCard(){
  document.getElementById('detailCard').classList.remove('open');
  document.getElementById('dim').classList.remove('on');
  selectedBook=null;currentBookId=null;
}
document.getElementById('dcClose').onclick=closeCard;
document.getElementById('dim').onclick=e=>{if(e.target===document.getElementById('dim'))closeCard();};

// ── LOAN ──
document.getElementById('loanBtn').onclick=()=>{if(document.getElementById('loanBtn').disabled)return;document.getElementById('loanErr').textContent='';document.getElementById('codeInput').value='';document.getElementById('loanModal').classList.add('active');};
document.getElementById('loanCancel').onclick=()=>document.getElementById('loanModal').classList.remove('active');
document.getElementById('loanConfirm').onclick=async()=>{
  const book=BOOKS.find(b=>b.id===currentBookId);if(!book)return;
  const code=document.getElementById('codeInput').value.trim().toLowerCase();
  const err=document.getElementById('loanErr');const btn=document.getElementById('loanConfirm');
  if(!VALID_CODES.includes(code)){err.textContent='invalid code.';return;}
  if(sessionLoans[book.id]){err.textContent='already loaned.';return;}
  sessionLoans[book.id]=true;btn.textContent='sending...';btn.disabled=true;
  try{if(window.emailjs)await emailjs.send(EMAILJS_SERVICE,EMAILJS_TEMPLATE,{'user-name':CODE_NAMES[code]||code,'book_title':book.title,'book_author':book.author==='N/A'?'':book.author});}catch(e){console.error(e);}
  btn.textContent='confirm';btn.disabled=false;
  document.getElementById('loanModal').classList.remove('active');
  const lb=document.getElementById('loanBtn');lb.textContent='on loan';lb.className='lbtn onloan';lb.disabled=true;
};

// ── SEARCH ──
function openSearch(){
  document.getElementById('searchBox').classList.add('open');
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').innerHTML='';
  document.getElementById('dim').classList.add('on');
  setTimeout(()=>document.getElementById('searchInput').focus(),80);
}
function closeSearch(){document.getElementById('searchBox').classList.remove('open');document.getElementById('dim').classList.remove('on');}
document.getElementById('searchClose').onclick=closeSearch;
document.getElementById('searchInput').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  const res=document.getElementById('searchResults');
  res.innerHTML='';
  if(!q){return;}
  const matches=BOOKS.filter(b=>(b.title+b.author+b.tags+b.cat+b.sub).toLowerCase().includes(q)).slice(0,12);
  matches.forEach(b=>{
    const d=document.createElement('div');d.className='sr';
    d.innerHTML=`${b.title}<div class="src">${b.cat} · ${b.sub}${b.author!=='N/A'?' · '+b.author:''}</div>`;
    d.onclick=()=>{
      closeSearch();
      const bn=bookNodes.find(n=>n.book.id===b.id);
      if(bn){
        if(focusedCat&&focusedCat!==b.cat)returnToFull();
        targetCamX=-bn.x;targetCamY=-bn.y;targetZoom=2.5;
        setTimeout(()=>openBook(bn),300);
      }
    };
    res.appendChild(d);
  });
  if(!matches.length){res.innerHTML='<div class="sr" style="color:rgba(255,255,255,0.2)">no results</div>';}
});

// ── LEGEND ──
const leg=document.getElementById('legend');
Object.entries(CAT_COLORS).forEach(([cat,col])=>{leg.innerHTML+=`<div class="li"><div class="ld" style="background:${col}"></div><div class="ll">${cat.toLowerCase()}</div></div>`;});

// ── ADMIN ──
document.getElementById('siteTitle').onclick=()=>{document.getElementById('adminPortal').classList.add('open');document.getElementById('adminIn').value='';document.getElementById('adminErr').textContent='';setTimeout(()=>document.getElementById('adminIn').focus(),50);};
document.getElementById('adminPortal').onclick=e=>{if(e.target===document.getElementById('adminPortal'))document.getElementById('adminPortal').classList.remove('open');};
document.getElementById('adminIn').addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.getElementById('adminPortal').classList.remove('open');return;}
  if(e.key==='Enter'){if(document.getElementById('adminIn').value.trim()===_s){window.location.href='admin.html';}else{document.getElementById('adminErr').textContent='incorrect.';document.getElementById('adminIn').value='';}}
});

window.addEventListener('load',()=>{if(window.emailjs)emailjs.init({publicKey:EMAILJS_PUBLIC});});
</script>
