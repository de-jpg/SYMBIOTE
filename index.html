<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Courier New',Courier,monospace;}
canvas{position:fixed;inset:0;display:block;}
body{cursor:none;}

#counter{position:fixed;top:16px;left:16px;font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:0.12em;z-index:10;pointer-events:none;}
#zoomBtns{position:fixed;top:44px;left:16px;display:flex;flex-direction:column;gap:5px;z-index:10;}
.zoom-btn{width:30px;height:30px;background:transparent;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);font-size:15px;cursor:none;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:border-color 0.2s;pointer-events:all;}
.zoom-btn:hover{border-color:rgba(255,255,255,0.35);}

/* DETAIL CARD */
#detailCard{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.95);
  width:min(400px,88vw);max-height:82vh;
  background:rgba(5,5,5,0.97);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:2px;padding:30px 26px 22px;
  z-index:100;overflow-y:auto;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity 0.3s ease,transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
#detailCard.open{opacity:1;pointer-events:all;transform:translate(-50%,-50%) scale(1);}
.dc-close{position:absolute;top:14px;right:16px;background:none;border:none;color:rgba(255,255,255,0.2);font-size:15px;cursor:none;pointer-events:all;transition:color 0.2s;}
.dc-close:hover{color:rgba(255,255,255,0.6);}
.dc-idx{font-size:8px;color:rgba(255,255,255,0.18);letter-spacing:0.14em;margin-bottom:16px;}
.dc-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle;}
.dc-title{font-size:18px;color:rgba(255,255,255,0.9);font-weight:normal;line-height:1.3;margin-bottom:5px;}
.dc-cat{font-size:8px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.22);margin-bottom:11px;}
.dc-author{font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:11px;}
.dc-tags{font-size:9.5px;color:rgba(255,255,255,0.32);line-height:1.9;margin-bottom:18px;}
.dc-related{margin-bottom:18px;}
.dc-rel-label{font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.16);margin-bottom:6px;}
.dc-rel-tag{display:inline-block;font-size:8px;color:rgba(255,255,255,0.38);border:1px solid rgba(255,255,255,0.08);padding:2px 7px;border-radius:1px;margin:2px 2px 0 0;cursor:none;transition:all 0.15s;pointer-events:all;}
.dc-rel-tag:hover{border-color:rgba(255,255,255,0.28);color:rgba(255,255,255,0.75);}
.dc-actions{display:flex;gap:7px;margin-top:4px;}
.loan-btn{flex:1;background:transparent;border:1px solid rgba(255,255,255,0.13);color:rgba(255,255,255,0.5);font-family:'Courier New',monospace;font-size:9px;padding:9px 12px;border-radius:1px;cursor:none;letter-spacing:0.1em;transition:all 0.2s;pointer-events:all;}
.loan-btn:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.3);}
.loan-btn.on-loan{border-color:rgba(200,60,60,0.3);color:rgba(200,80,80,0.6);}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.goodreads-btn{flex:1;background:transparent;border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.25);font-family:'Courier New',monospace;font-size:9px;padding:9px 12px;border-radius:1px;text-decoration:none;display:flex;align-items:center;justify-content:center;letter-spacing:0.08em;transition:all 0.2s;}
.goodreads-btn:hover{border-color:rgba(255,255,255,0.18);color:rgba(255,255,255,0.55);}

#dimOverlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0);pointer-events:none;transition:background 0.3s;}
#dimOverlay.on{background:rgba(0,0,0,0.8);pointer-events:all;}

#loanModal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.95);align-items:center;justify-content:center;}
#loanModal.active{display:flex;}
.loan-box{background:#050505;border:1px solid rgba(255,255,255,0.07);border-radius:2px;padding:24px 26px;width:min(280px,88vw);}
.loan-box h3{font-size:10px;font-weight:normal;color:rgba(255,255,255,0.7);margin-bottom:4px;}
.loan-box p{font-size:8px;color:rgba(255,255,255,0.2);margin-bottom:12px;}
.loan-box input{width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.09);color:rgba(255,255,255,0.8);font-family:'Courier New',monospace;font-size:13px;padding:8px 10px;border-radius:1px;margin-bottom:6px;outline:none;}
.loan-box input:focus{border-color:rgba(255,255,255,0.24);}
.loan-box input::placeholder{color:rgba(255,255,255,0.13);}
.loan-row-btns{display:flex;gap:5px;margin-top:6px;}
.loan-confirm{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.65);font-family:'Courier New',monospace;font-size:9px;padding:8px;border-radius:1px;cursor:none;pointer-events:all;}
.loan-cancel{background:transparent;border:1px solid rgba(255,255,255,0.05);color:rgba(255,255,255,0.2);font-family:'Courier New',monospace;font-size:9px;padding:8px 10px;border-radius:1px;cursor:none;pointer-events:all;}
.loan-error{font-size:9px;color:#904040;margin-top:4px;min-height:12px;}

#legend{position:fixed;bottom:18px;left:16px;z-index:10;pointer-events:none;}
.leg-item{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.leg-dot{width:6px;height:6px;border-radius:50%;}
.leg-label{font-size:8px;color:rgba(255,255,255,0.18);letter-spacing:0.08em;}

#siteTitle{position:fixed;bottom:18px;right:18px;font-size:8px;letter-spacing:0.22em;color:rgba(255,255,255,0.1);font-family:'Courier New',monospace;cursor:none;z-index:10;pointer-events:all;transition:color 0.2s;text-transform:lowercase;}
#siteTitle:hover{color:rgba(255,255,255,0.35);}

#adminPortal{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.98);align-items:center;justify-content:center;}
#adminPortal.open{display:flex;}
#adminIn{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);font-family:'Courier New',monospace;font-size:18px;letter-spacing:0.3em;text-align:center;outline:none;width:120px;padding:5px 0;display:block;margin:0 auto;}
#adminLabel{font-size:8px;letter-spacing:0.2em;color:#1a1a1a;text-align:center;margin-bottom:12px;}
#adminErr{font-size:8px;color:#904040;text-align:center;margin-top:7px;min-height:11px;}
</style>

<body>
<canvas id="graphCanvas"></canvas>
<canvas id="uiCanvas"></canvas>

<div id="counter"></div>
<div id="zoomBtns">
  <button class="zoom-btn" id="zoomIn">+</button>
  <button class="zoom-btn" id="zoomOut">−</button>
</div>
<div id="legend"></div>
<div id="siteTitle">jo's library</div>
<div id="dimOverlay"></div>

<div id="detailCard">
  <button class="dc-close" id="dcClose">✕</button>
  <div class="dc-idx" id="dcIdx"></div>
  <div class="dc-title" id="dcTitle"></div>
  <div class="dc-cat" id="dcCat"></div>
  <div class="dc-author" id="dcAuthor"></div>
  <div class="dc-tags" id="dcTags"></div>
  <div class="dc-related" id="dcRelated"></div>
  <div class="dc-actions">
    <button class="loan-btn" id="loanBtn">loan</button>
    <a class="goodreads-btn" id="goodreadsBtn" href="#" target="_blank" rel="noopener">goodreads ↗</a>
  </div>
</div>

<div id="loanModal">
  <div class="loan-box">
    <h3 id="loanModalTitle"></h3>
    <p>enter code</p>
    <input type="text" id="codeInput" placeholder="code" style="text-transform:lowercase;letter-spacing:0.12em;"/>
    <div class="loan-error" id="loanError"></div>
    <div class="loan-row-btns">
      <button class="loan-confirm" id="loanConfirm">confirm loan</button>
      <button class="loan-cancel" id="loanCancel">cancel</button>
    </div>
  </div>
</div>

<div id="adminPortal">
  <div>
    <div id="adminLabel">access code</div>
    <input type="password" id="adminIn" placeholder="——" autocomplete="off"/>
    <div id="adminErr"></div>
  </div>
</div>

const BOOKS=RAW.map((b,i)=>({id:i+1,...b}));
const N=BOOKS.length;

// ── RADIAL TREE LAYOUT ──
// Each category gets a hub node, books branch out from it
const CATS=Object.keys(CAT_COLORS);
const CAT_ANGLES={
  "History":     Math.PI*0.1,
  "Theory":      Math.PI*0.55,
  "Monographs":  Math.PI*1.0,
  "Typologies":  Math.PI*1.45,
  "Technical":   Math.PI*1.75,
  "Serials":     Math.PI*1.25,
};
const HUB_R=260; // distance of hub from center

// Hub nodes (one per category)
const hubs=CATS.map(cat=>{
  const angle=CAT_ANGLES[cat]||0;
  return{
    id:'hub_'+cat,cat,
    x:Math.cos(angle)*HUB_R,
    y:Math.sin(angle)*HUB_R,
    vx:0,vy:0,isHub:true
  };
});

// Book nodes – start near their hub
const nodes=BOOKS.map((b,i)=>{
  const hub=hubs.find(h=>h.cat===b.cat);
  const angle=Math.random()*Math.PI*2;
  const r=30+Math.random()*60;
  return{
    id:b.id,book:b,
    x:(hub?hub.x:0)+Math.cos(angle)*r,
    y:(hub?hub.y:0)+Math.sin(angle)*r,
    vx:0,vy:0,
    hubIdx:hubs.findIndex(h=>h.cat===b.cat),
  };
});

// Sub-hub nodes – one per unique sub-category
const subMap={};
BOOKS.forEach(b=>{const k=b.cat+'//'+b.sub;if(!subMap[k])subMap[k]={cat:b.cat,sub:b.sub,books:[]};subMap[k].books.push(b.id);});
const subHubs=Object.values(subMap).map(s=>{
  const hub=hubs.find(h=>h.cat===s.cat);
  const angle=Math.random()*Math.PI*2;
  return{id:'sub_'+s.cat+'_'+s.sub,cat:s.cat,sub:s.sub,
    x:(hub?hub.x:0)+Math.cos(angle)*80,
    y:(hub?hub.y:0)+Math.sin(angle)*80,
    vx:0,vy:0,isSubHub:true,books:s.books};
});

// Edges: hub→subhub, subhub→books
const edges=[];
hubs.forEach((h,hi)=>{
  // hub to subhubs of same cat
  subHubs.filter(s=>s.cat===h.cat).forEach(s=>{
    edges.push({type:'hub-sub',a:h,b:s});
  });
});
subHubs.forEach(s=>{
  s.books.forEach(bid=>{
    const ni=nodes.findIndex(n=>n.id===bid);
    if(ni>=0)edges.push({type:'sub-book',a:s,b:nodes[ni]});
  });
});
// Cross-category bridges (shared themes)
const BRIDGES=[
  ['urban','city','cities','planning'],
  ['modernism','modern architecture'],
  ['housing','residential','dwelling'],
];
BRIDGES.forEach(kwds=>{
  const matches=BOOKS.filter(b=>kwds.some(k=>(b.tags+b.sub+b.title).toLowerCase().includes(k)));
  const cats=[...new Set(matches.map(m=>m.cat))];
  if(cats.length>1){
    // connect one book per cat to one book in another cat
    for(let i=0;i<cats.length-1;i++){
      const a=matches.find(m=>m.cat===cats[i]);
      const b=matches.find(m=>m.cat===cats[i+1]);
      if(a&&b){
        const na=nodes.find(n=>n.id===a.id);
        const nb=nodes.find(n=>n.id===b.id);
        if(na&&nb)edges.push({type:'cross',a:na,b:nb});
      }
    }
  }
});

// ── CANVAS ──
const gc=document.getElementById('graphCanvas');
const uc=document.getElementById('uiCanvas');
const gx=gc.getContext('2d');
const ux=uc.getContext('2d');
let W,H;
function resize(){W=gc.width=uc.width=window.innerWidth;H=gc.height=uc.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();

// ── CAMERA ──
let camX=0,camY=0,zoom=0.85;
function w2s(wx,wy){return{x:(wx+camX)*zoom+W/2,y:(wy+camY)*zoom+H/2};}
function s2w(sx,sy){return{x:(sx-W/2)/zoom-camX,y:(sy-H/2)/zoom-camY};}

// ── PHYSICS (radial tree) ──
// Only book nodes move; hubs and subhubs are semi-fixed
const DAMP=0.75,REPEL=1200,IDEAL_BOOK=55,ATTRACT_BOOK=0.04;

function simulate(){
  // Book-to-book repulsion (within same cat only, capped)
  for(let i=0;i<N;i++){
    for(let j=i+1;j<N;j++){
      if(BOOKS[i].cat!==BOOKS[j].cat)continue;
      const a=nodes[i],b=nodes[j];
      const dx=a.x-b.x,dy=a.y-b.y;
      const d2=Math.max(dx*dx+dy*dy,1);
      if(d2>160*160)continue;
      const f=REPEL/d2;
      const inv=1/Math.sqrt(d2);
      a.vx+=dx*inv*f;a.vy+=dy*inv*f;
      b.vx-=dx*inv*f;b.vy-=dy*inv*f;
    }
  }
  // Book to subhub attraction
  edges.forEach(e=>{
    if(e.type!=='sub-book')return;
    const a=e.b; // book node
    const b=e.a; // subhub
    const dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)+0.01;
    const f=(d-IDEAL_BOOK)*ATTRACT_BOOK;
    a.vx+=(dx/d)*f;a.vy+=(dy/d)*f;
  });
  // Integrate
  for(const n of nodes){
    n.vx*=DAMP;n.vy*=DAMP;
    n.x+=n.vx;n.y+=n.vy;
  }
}

// ── INTRO ──
let introPhase=0,introStart=Date.now(),introActive=true;
const INTRO_HOLD=2000,INTRO_FADE=1200;
const introLetters=[];
(function buildIntro(){
  const JOSIAH="JOSIAH PRINCE GOMEZ";
  const cols=Math.ceil(Math.sqrt(N*1.5));
  const spacingX=Math.min(W/(cols+1),52);
  const spacingY=spacingX;
  const rows=Math.ceil(N/cols);
  const startX=(W-(spacingX*(cols-1)))/2;
  const startY=(H-(spacingY*(rows-1)))/2;
  const shuffled=[...BOOKS].sort(()=>Math.random()-0.5);
  shuffled.forEach((b,i)=>{
    const col=i%cols,row=Math.floor(i/cols);
    const sx=startX+col*spacingX+(Math.random()-0.5)*10;
    const sy=startY+row*spacingY+(Math.random()-0.5)*10;
    const isJ=b.author.toLowerCase().includes('josiah prince gomez');
    introLetters.push({char:b.title[0].toUpperCase(),sx,sy,nodeIdx:nodes.findIndex(n=>n.id===b.id),isJ,alpha:0});
  });
  // Josiah center letters
  const jx=W/2,jy=H/2;
  const jSpacing=16;
  const jStart=jx-(JOSIAH.length/2)*jSpacing;
  JOSIAH.split('').forEach((ch,i)=>{
    introLetters.push({char:ch,sx:jStart+i*jSpacing,sy:jy,nodeIdx:-1,isJ:true,alpha:0,isName:true});
  });
})();

function drawIntro(){
  const now=Date.now(),elapsed=now-introStart;
  gx.clearRect(0,0,W,H);ux.clearRect(0,0,W,H);
  if(introPhase===0){
    // fade in letters
    introLetters.forEach(l=>{l.alpha=Math.min(l.alpha+0.025,1);});
    introLetters.forEach(l=>{
      gx.font=`${l.isName?15:13}px 'Courier New',monospace`;
      gx.textAlign='center';
      gx.fillStyle=l.isJ?`rgba(220,50,50,${l.alpha})`:`rgba(255,255,255,${l.alpha*0.45})`;
      gx.fillText(l.char,l.sx,l.sy);
    });
    if(elapsed>INTRO_HOLD)introPhase=1,introStart=now;
  } else if(introPhase===1){
    const t=Math.min((now-introStart)/INTRO_FADE,1);
    const ease=1-Math.pow(1-t,3);
    introLetters.forEach(l=>{
      if(l.isName){
        // name fades out
        const al=(1-ease)*l.alpha;
        gx.font=`15px 'Courier New',monospace`;
        gx.textAlign='center';
        gx.fillStyle=`rgba(220,50,50,${al})`;
        gx.fillText(l.char,l.sx,l.sy);
        return;
      }
      const ni=l.nodeIdx;if(ni<0)return;
      const target=w2s(nodes[ni].x,nodes[ni].y);
      const cx=l.sx+(target.x-l.sx)*ease;
      const cy=l.sy+(target.y-l.sy)*ease;
      const col=CAT_COLORS[BOOKS[nodes[ni].id-1].cat]||'#fff';
      // letter fades, dot grows
      if(ease<0.7){
        const la=(1-ease/0.7)*0.45;
        gx.font=`${13*(1-ease*0.8)}px 'Courier New',monospace`;
        gx.textAlign='center';
        gx.fillStyle=l.isJ?`rgba(220,50,50,${la})`:`rgba(255,255,255,${la})`;
        gx.fillText(l.char,cx,cy);
      }
      if(ease>0.3){
        const da=(ease-0.3)/0.7;
        gx.fillStyle=l.isJ?`rgba(220,50,50,${da})`:col+'cc';
        gx.beginPath();gx.arc(cx,cy,Math.max(ease*4,1.5),0,Math.PI*2);gx.fill();
      }
    });
    if(t>=1){introPhase=2;introActive=false;}
  }
  // cursor
  ux.fillStyle='rgba(255,255,255,0.85)';
  ux.beginPath();ux.arc(mouseX,mouseY,4,0,Math.PI*2);ux.fill();
}

// ── DRAW GRAPH ──
function hexAlpha(hex,a){
  const n=parseInt(hex.replace('#',''),16);
  return`rgba(${(n>>16)&0xff},${(n>>8)&0xff},${n&0xff},${a})`;
}

function drawGraph(){
  gx.clearRect(0,0,W,H);

  // Edges
  edges.forEach(e=>{
    const sa=w2s(e.a.x,e.a.y),sb=w2s(e.b.x,e.b.y);
    const col=CAT_COLORS[e.a.cat||e.b.cat]||'#888';
    let al,lw;
    if(e.type==='hub-sub'){al=0.25;lw=1.0;}
    else if(e.type==='sub-book'){al=0.18;lw=0.7;}
    else{al=0.07;lw=0.4;}
    // gradient line matching colour
    const g=gx.createLinearGradient(sa.x,sa.y,sb.x,sb.y);
    g.addColorStop(0,hexAlpha(col,al));
    g.addColorStop(1,hexAlpha(col,al*0.4));
    gx.strokeStyle=g;gx.lineWidth=lw;
    gx.beginPath();gx.moveTo(sa.x,sa.y);gx.lineTo(sb.x,sb.y);gx.stroke();
  });

  // Hub nodes
  hubs.forEach(h=>{
    const s=w2s(h.x,h.y);
    const col=CAT_COLORS[h.cat];
    const r=10*Math.min(zoom,1.5);
    // glow
    const g=gx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*5);
    g.addColorStop(0,hexAlpha(col,0.35));g.addColorStop(1,'transparent');
    gx.fillStyle=g;gx.beginPath();gx.arc(s.x,s.y,r*5,0,Math.PI*2);gx.fill();
    // fill
    gx.fillStyle=col;gx.beginPath();gx.arc(s.x,s.y,r,0,Math.PI*2);gx.fill();
    // label
    gx.font=`bold 11px 'Courier New',monospace`;
    gx.textAlign='center';
    gx.fillStyle='rgba(255,255,255,0.8)';
    gx.fillText(h.cat.toLowerCase(),s.x,s.y-r-8);
  });

  // Sub-hub nodes
  subHubs.forEach(s=>{
    const sc=w2s(s.x,s.y);
    const col=CAT_COLORS[s.cat];
    const r=5.5*Math.min(zoom,1.5);
    const g=gx.createRadialGradient(sc.x,sc.y,0,sc.x,sc.y,r*3.5);
    g.addColorStop(0,hexAlpha(col,0.28));g.addColorStop(1,'transparent');
    gx.fillStyle=g;gx.beginPath();gx.arc(sc.x,sc.y,r*3.5,0,Math.PI*2);gx.fill();
    gx.fillStyle=hexAlpha(col,0.75);gx.beginPath();gx.arc(sc.x,sc.y,r,0,Math.PI*2);gx.fill();
  });

  // Book nodes
  for(let i=0;i<N;i++){
    const n=nodes[i];
    const s=w2s(n.x,n.y);
    if(s.x<-30||s.x>W+30||s.y<-30||s.y>H+30)continue;
    const isHov=hoveredNode===i,isSel=selectedNode===i;
    const col=CAT_COLORS[n.book.cat]||'#fff';
    const r=(isSel?7:isHov?6:3.5)*Math.min(zoom*1.1,1.8);
    if(isHov||isSel){
      const g=gx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*5);
      g.addColorStop(0,hexAlpha(col,0.4));g.addColorStop(1,'transparent');
      gx.fillStyle=g;gx.beginPath();gx.arc(s.x,s.y,r*5,0,Math.PI*2);gx.fill();
    }
    gx.fillStyle=isSel||isHov?col:hexAlpha(col,0.72);
    gx.beginPath();gx.arc(s.x,s.y,r,0,Math.PI*2);gx.fill();
    if(isSel){gx.strokeStyle=col;gx.lineWidth=1.5;gx.beginPath();gx.arc(s.x,s.y,r+5,0,Math.PI*2);gx.stroke();}
    if(isHov||isSel){
      const label=n.book.title;
      gx.font=`${isSel?11.5:9.5}px 'Courier New',monospace`;gx.textAlign='left';
      const tw=gx.measureText(label).width;
      const lx=s.x+r+5,ly=s.y+4;
      gx.fillStyle='rgba(0,0,0,0.88)';gx.fillRect(lx-3,ly-11,tw+6,16);
      gx.fillStyle=isSel?'rgba(255,255,255,0.92)':'rgba(255,255,255,0.8)';
      gx.fillText(label,lx,ly);
    }
  }
}

// ── CURSOR + NEAREST LINES ──
let mouseX=W/2,mouseY=H/2,hoveredNode=null,selectedNode=null;
window.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;});

function drawCursor(){
  ux.clearRect(0,0,W,H);
  if(!introActive){
    const REACH=160,COUNT=5;
    const cands=[];
    for(let i=0;i<N;i++){
      const s=w2s(nodes[i].x,nodes[i].y);
      const d=Math.hypot(s.x-mouseX,s.y-mouseY);
      if(d<REACH)cands.push({i,d,s});
    }
    cands.sort((a,b)=>a.d-b.d);
    cands.slice(0,COUNT).forEach(c=>{
      const al=0.22*(1-c.d/REACH);
      ux.strokeStyle=`rgba(255,255,255,${al})`;
      ux.lineWidth=0.55;
      ux.beginPath();ux.moveTo(mouseX,mouseY);ux.lineTo(c.s.x,c.s.y);ux.stroke();
      ux.fillStyle=`rgba(255,255,255,${al*2})`;
      ux.beginPath();ux.arc(c.s.x,c.s.y,1.8,0,Math.PI*2);ux.fill();
    });
    // hover detect
    const wm=s2w(mouseX,mouseY);const HR=13/zoom;
    let best=null,bd=Infinity;
    for(let i=0;i<N;i++){
      const d=Math.hypot(nodes[i].x-wm.x,nodes[i].y-wm.y);
      if(d<HR&&d<bd){bd=d;best=i;}
    }
    hoveredNode=best;
  }
  // dot cursor
  ux.fillStyle='rgba(255,255,255,0.92)';
  ux.beginPath();ux.arc(mouseX,mouseY,4,0,Math.PI*2);ux.fill();
  ux.strokeStyle='rgba(255,255,255,0.25)';
  ux.lineWidth=0.8;
  ux.beginPath();ux.arc(mouseX,mouseY,7,0,Math.PI*2);ux.stroke();
}

// ── LOOP ──
let simStep=0;
function loop(){
  if(introActive){drawIntro();}
  else{
    if(simStep<600)simulate();
    simStep++;
    drawGraph();
    document.getElementById('counter').textContent=`${N} / jo's library`;
  }
  drawCursor();
  requestAnimationFrame(loop);
}
loop();

// ── DRAG / CLICK ──
let isDrag=false,lastMX=0,lastMY=0,dragMoved=false;
uc.addEventListener('mousedown',e=>{isDrag=true;lastMX=e.clientX;lastMY=e.clientY;dragMoved=false;});
gc.addEventListener('mousedown',e=>{isDrag=true;lastMX=e.clientX;lastMY=e.clientY;dragMoved=false;});
window.addEventListener('mousemove',e=>{
  if(isDrag){
    const dx=e.clientX-lastMX,dy=e.clientY-lastMY;
    camX+=dx/zoom;camY+=dy/zoom;lastMX=e.clientX;lastMY=e.clientY;
    if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;
  }
});
window.addEventListener('mouseup',e=>{
  if(!isDrag)return;isDrag=false;
  if(!dragMoved&&hoveredNode!==null)openNode(hoveredNode);
  dragMoved=false;
});
window.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:0.9;
  const wx=(e.clientX-W/2)/zoom-camX,wy=(e.clientY-H/2)/zoom-camY;
  zoom=Math.max(0.15,Math.min(8,zoom*f));
  camX=(e.clientX-W/2)/zoom-wx;camY=(e.clientY-H/2)/zoom-wy;
},{passive:false});
let tSX=0,tSY=0,tD=false;
uc.addEventListener('touchstart',e=>{tSX=e.touches[0].clientX;tSY=e.touches[0].clientY;tD=false;lastMX=tSX;lastMY=tSY;},{passive:true});
uc.addEventListener('touchmove',e=>{camX+=(e.touches[0].clientX-lastMX)/zoom;camY+=(e.touches[0].clientY-lastMY)/zoom;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;tD=true;mouseX=lastMX;mouseY=lastMY;},{passive:true});
uc.addEventListener('touchend',e=>{
  if(!tD){const t=e.changedTouches[0],wm=s2w(t.clientX,t.clientY),HR=20/zoom;
    for(let i=0;i<N;i++)if(Math.hypot(nodes[i].x-wm.x,nodes[i].y-wm.y)<HR){openNode(i);return;}
  }
});
document.getElementById('zoomIn').addEventListener('click',()=>{zoom=Math.min(8,zoom*1.25);});
document.getElementById('zoomOut').addEventListener('click',()=>{zoom=Math.max(0.15,zoom/1.25);});

// ── NODE DETAIL ──
let currentBookId=null;const sessionLoans={};
function loadLoans(){try{return JSON.parse(localStorage.getItem(LOANS_KEY)||'[]');}catch{return[];}}
function isOnLoan(title){return loadLoans().some(l=>{const due=new Date(l.date);due.setDate(due.getDate()+14);const now=new Date();now.setHours(0,0,0,0);due.setHours(0,0,0,0);return l.title===title&&Math.round((due-now)/86400000)>0;});}

function openNode(idx){
  const book=BOOKS[idx];selectedNode=idx;currentBookId=book.id;
  document.getElementById('dcIdx').innerHTML=`<span class="dc-dot" style="background:${CAT_COLORS[book.cat]}"></span>${book.id} / ${N}`;
  document.getElementById('dcTitle').textContent=book.title;
  document.getElementById('dcCat').textContent=`${book.cat} · ${book.sub}`;
  document.getElementById('dcAuthor').textContent=book.author==='N/A'?'':book.author;
  document.getElementById('dcTags').textContent=book.tags;
  const rel=BOOKS.filter(b=>b.sub===book.sub&&b.id!==book.id).slice(0,5);
  const rw=document.getElementById('dcRelated');
  rw.innerHTML=`<div class="dc-rel-label">in same collection</div>`;
  rel.forEach(r=>{const t=document.createElement('span');t.className='dc-rel-tag';t.textContent=r.title;t.onclick=()=>{const i=nodes.findIndex(n=>n.id===r.id);if(i>=0)openNode(i);};rw.appendChild(t);});
  const lb=document.getElementById('loanBtn');
  const onLoan=isOnLoan(book.title)||sessionLoans[book.id];
  lb.textContent=onLoan?'on loan':'loan';lb.className=onLoan?'loan-btn on-loan':'loan-btn';lb.disabled=!!onLoan;
  const q=encodeURIComponent(book.title+' '+(book.author==='N/A'?'':book.author));
  document.getElementById('goodreadsBtn').href=`https://www.goodreads.com/search?q=${q}`;
  document.getElementById('loanModalTitle').textContent=book.title;
  camX=-nodes[idx].x;camY=-nodes[idx].y;
  document.getElementById('dimOverlay').classList.add('on');
  document.getElementById('detailCard').classList.add('open');
}
function closeCard(){document.getElementById('detailCard').classList.remove('open');document.getElementById('dimOverlay').classList.remove('on');selectedNode=null;currentBookId=null;}
document.getElementById('dcClose').onclick=closeCard;
document.getElementById('dimOverlay').onclick=closeCard;

// ── LOAN ──
document.getElementById('loanBtn').onclick=()=>{if(document.getElementById('loanBtn').disabled)return;document.getElementById('loanError').textContent='';document.getElementById('codeInput').value='';document.getElementById('loanModal').classList.add('active');};
document.getElementById('loanCancel').onclick=()=>document.getElementById('loanModal').classList.remove('active');
document.getElementById('loanConfirm').onclick=async()=>{
  const book=BOOKS.find(b=>b.id===currentBookId);if(!book)return;
  const code=document.getElementById('codeInput').value.trim().toLowerCase();
  const err=document.getElementById('loanError');const btn=document.getElementById('loanConfirm');
  if(!VALID_CODES.includes(code)){err.textContent='invalid code.';return;}
  if(sessionLoans[book.id]){err.textContent='already loaned.';return;}
  sessionLoans[book.id]=true;btn.textContent='sending...';btn.disabled=true;
  try{if(window.emailjs)await emailjs.send(EMAILJS_SERVICE,EMAILJS_TEMPLATE,{'user-name':CODE_NAMES[code]||code,'book_title':book.title,'book_author':book.author==='N/A'?'':book.author});}catch(e){console.error(e);}
  btn.textContent='confirm loan';btn.disabled=false;
  document.getElementById('loanModal').classList.remove('active');
  const lb=document.getElementById('loanBtn');lb.textContent='on loan';lb.className='loan-btn on-loan';lb.disabled=true;
};

// ── LEGEND ──
const leg=document.getElementById('legend');
Object.entries(CAT_COLORS).forEach(([cat,col])=>{leg.innerHTML+=`<div class="leg-item"><div class="leg-dot" style="background:${col}"></div><div class="leg-label">${cat.toLowerCase()}</div></div>`;});

// ── ADMIN ──
document.getElementById('siteTitle').onclick=()=>{document.getElementById('adminPortal').classList.add('open');document.getElementById('adminIn').value='';document.getElementById('adminErr').textContent='';setTimeout(()=>document.getElementById('adminIn').focus(),50);};
document.getElementById('adminPortal').onclick=e=>{if(e.target===document.getElementById('adminPortal'))document.getElementById('adminPortal').classList.remove('open');};
document.getElementById('adminIn').addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.getElementById('adminPortal').classList.remove('open');return;}
  if(e.key==='Enter'){if(document.getElementById('adminIn').value.trim()===_s){window.location.href='admin.html';}else{document.getElementById('adminErr').textContent='incorrect.';document.getElementById('adminIn').value='';}}
});

window.addEventListener('load',()=>{if(window.emailjs)emailjs.init({publicKey:EMAILJS_PUBLIC});});
</script>
</body>
</html>
