<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#0d0d0d;overflow:hidden;font-family:'Courier New',Courier,monospace;}

/* CANVAS */
#graphCanvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab;}
#graphCanvas.dragging{cursor:grabbing;}
#graphCanvas.hovering{cursor:pointer;}

/* COUNTER */
#counter{position:fixed;top:16px;left:16px;font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:0.08em;font-family:'Courier New',monospace;z-index:10;pointer-events:none;}

/* ZOOM */
#zoomBtns{position:fixed;top:16px;left:16px;display:flex;flex-direction:column;gap:6px;z-index:10;margin-top:32px;}
.zoom-btn{width:36px;height:36px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.6);font-size:18px;font-family:'Courier New',monospace;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background 0.2s;}
.zoom-btn:hover{background:rgba(255,255,255,0.14);}

/* DETAIL CARD */
#detailCard{
  position:fixed;right:0;top:0;bottom:0;
  width:min(340px,90vw);
  background:#111;
  border-left:1px solid rgba(255,255,255,0.07);
  padding:28px 24px;
  z-index:50;
  overflow-y:auto;
  transform:translateX(100%);
  transition:transform 0.38s cubic-bezier(0.4,0,0.2,1);
  display:flex;flex-direction:column;
}
#detailCard.open{transform:translateX(0);}
.dc-close{position:absolute;top:18px;right:20px;background:none;border:none;color:rgba(255,255,255,0.3);font-size:18px;cursor:pointer;font-family:'Courier New',monospace;transition:color 0.2s;}
.dc-close:hover{color:rgba(255,255,255,0.7);}
.dc-counter{font-size:9px;color:rgba(255,255,255,0.25);letter-spacing:0.12em;margin-bottom:20px;}
.dc-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle;}
.dc-title{font-size:20px;color:rgba(255,255,255,0.92);font-weight:normal;line-height:1.3;margin-bottom:6px;}
.dc-cat{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.28);margin-bottom:16px;}
.dc-author{font-size:11px;color:rgba(255,255,255,0.45);margin-bottom:14px;}
.dc-tags{font-size:10px;color:rgba(255,255,255,0.38);line-height:1.8;margin-bottom:24px;}
.dc-cover{width:100%;aspect-ratio:2/3;background:#1a1a1a;border-radius:2px;margin-bottom:20px;display:none;object-fit:cover;}
.dc-cover.show{display:block;}
.dc-related{margin-bottom:20px;}
.dc-related-label{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.2);margin-bottom:8px;}
.dc-related-tag{display:inline-block;font-size:9px;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.1);padding:3px 9px;border-radius:1px;margin:2px 2px 0 0;cursor:pointer;transition:all 0.15s;font-family:'Courier New',monospace;}
.dc-related-tag:hover{border-color:rgba(255,255,255,0.35);color:rgba(255,255,255,0.85);}
.loan-btn{
  margin-top:auto;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid rgba(255,255,255,0.18);
  color:rgba(255,255,255,0.6);font-family:'Courier New',monospace;font-size:11px;
  padding:10px 20px;border-radius:1px;cursor:pointer;letter-spacing:0.1em;
  transition:background 0.2s,border-color 0.2s,color 0.2s;
}
.loan-btn:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.38);color:rgba(255,255,255,0.88);}
.loan-btn.on-loan{border-color:rgba(160,60,60,0.4);color:rgba(200,80,80,0.7);animation:shake 0.4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-4px);}40%{transform:translateX(4px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px)};}

/* LOAN MODAL */
#loanModal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.92);align-items:center;justify-content:center;}
#loanModal.active{display:flex;}
.loan-box{background:#0d0d0d;border:1px solid rgba(255,255,255,0.08);border-radius:2px;padding:28px 30px;width:min(300px,90vw);}
.loan-box h3{font-size:11px;font-family:'Courier New',monospace;font-weight:normal;color:rgba(255,255,255,0.75);margin-bottom:4px;}
.loan-box p{font-size:9px;color:rgba(255,255,255,0.25);font-family:'Courier New',monospace;margin-bottom:14px;}
.loan-box input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);font-family:'Courier New',monospace;font-size:13px;padding:9px 12px;border-radius:1px;margin-bottom:7px;outline:none;}
.loan-box input:focus{border-color:rgba(255,255,255,0.28);}
.loan-box input::placeholder{color:rgba(255,255,255,0.18);}
.loan-row-btns{display:flex;gap:7px;margin-top:8px;}
.loan-confirm{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.72);font-family:'Courier New',monospace;font-size:10px;padding:9px;border-radius:1px;cursor:pointer;transition:background 0.2s;}
.loan-confirm:hover{background:rgba(255,255,255,0.13);}
.loan-cancel{background:transparent;border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.25);font-family:'Courier New',monospace;font-size:10px;padding:9px 12px;border-radius:1px;cursor:pointer;}
.loan-error{font-size:10px;color:#a06060;font-family:'Courier New',monospace;margin-top:4px;min-height:14px;}

/* LEGEND */
#legend{position:fixed;bottom:20px;left:16px;z-index:10;pointer-events:none;}
.leg-item{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.leg-dot{width:8px;height:8px;border-radius:50%;}
.leg-label{font-size:9px;color:rgba(255,255,255,0.25);letter-spacing:0.08em;font-family:'Courier New',monospace;}

/* TITLE */
#siteTitle{position:fixed;bottom:20px;right:20px;font-size:9px;letter-spacing:0.2em;color:rgba(255,255,255,0.15);font-family:'Courier New',monospace;cursor:pointer;z-index:10;transition:color 0.2s;}
#siteTitle:hover{color:rgba(255,255,255,0.4);}

/* ADMIN PORTAL */
#adminPortal{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.96);align-items:center;justify-content:center;}
#adminPortal.open{display:flex;}
.admin-code-wrap{text-align:center;}
.admin-code-label{font-size:9px;letter-spacing:0.2em;color:#333;font-family:'Courier New',monospace;margin-bottom:14px;}
#adminCodeInput{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.7);font-family:'Courier New',monospace;font-size:20px;letter-spacing:0.3em;text-align:center;outline:none;width:140px;padding:6px 0;}
#adminCodeError{font-size:9px;color:#a06060;font-family:'Courier New',monospace;margin-top:8px;min-height:12px;}

/* MOBILE: stack card below */
@media(max-width:600px){
  #detailCard{right:auto;left:0;top:auto;bottom:0;width:100vw;height:65vh;border-left:none;border-top:1px solid rgba(255,255,255,0.07);transform:translateY(100%);}
  #detailCard.open{transform:translateY(0);}
}
</style>

const BOOKS=RAW.map((b,i)=>({id:i+1,...b}));
const N=BOOKS.length;

// ── LOANS ──
function loadLoans(){try{return JSON.parse(localStorage.getItem(LOANS_KEY)||'[]');}catch{return[];}}
function isOnLoan(bookTitle){
  return loadLoans().some(l=>{
    const days=(()=>{const due=new Date(l.date);due.setDate(due.getDate()+14);const now=new Date();now.setHours(0,0,0,0);due.setHours(0,0,0,0);return Math.round((due-now)/86400000);})();
    return l.title===bookTitle&&days>0;
  });
}
const sessionLoans={};

// ── FORCE GRAPH ──
const canvas=document.getElementById('graphCanvas');
const ctx=canvas.getContext('2d');
let W,H;

// Nodes
const nodes=BOOKS.map((b,i)=>({
  id:b.id,book:b,
  x:Math.random()*1600-800,
  y:Math.random()*1000-500,
  vx:0,vy:0,
  r:5,
}));

// Edges: same category AND same sub
const edges=[];
for(let i=0;i<N;i++){
  for(let j=i+1;j<N;j++){
    if(BOOKS[i].cat===BOOKS[j].cat){
      // stronger edge if same sub
      const w=BOOKS[i].sub===BOOKS[j].sub?1.0:0.3;
      edges.push({a:i,b:j,w});
    }
  }
}

// Camera
let camX=0,camY=0,zoom=1;
let dragging=false,lastMX=0,lastMY=0;
let hoveredNode=null,selectedNode=null;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
window.addEventListener('resize',resize);
resize();

// ── FORCE SIMULATION ──
let simRunning=true;
const K_REPEL=3200;
const K_ATTRACT=0.018;
const K_SAME_SUB=0.05;
const DAMPING=0.82;
const CENTER_PULL=0.004;

function simulate(){
  if(!simRunning)return;
  // Repulsion between all pairs (barnes-hut approximation: just do all for <200 nodes, do grid for more)
  for(let i=0;i<N;i++){
    const a=nodes[i];
    for(let j=i+1;j<N;j++){
      const b=nodes[j];
      const dx=a.x-b.x,dy=a.y-b.y;
      const d2=dx*dx+dy*dy+1;
      const f=K_REPEL/d2;
      const nx=dx/Math.sqrt(d2),ny=dy/Math.sqrt(d2);
      a.vx+=nx*f;a.vy+=ny*f;
      b.vx-=nx*f;b.vy-=ny*f;
    }
  }
  // Attraction along edges
  for(const e of edges){
    const a=nodes[e.a],b=nodes[e.b];
    const dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)+0.01;
    const idealDist=BOOKS[e.a].sub===BOOKS[e.b].sub?80:220;
    const f=(d-idealDist)*K_ATTRACT*e.w*(BOOKS[e.a].sub===BOOKS[e.b].sub?K_SAME_SUB/K_ATTRACT:1);
    const nx=dx/d,ny=dy/d;
    a.vx+=nx*f;a.vy+=ny*f;
    b.vx-=nx*f;b.vy-=ny*f;
  }
  // Center pull
  for(const n of nodes){
    n.vx-=n.x*CENTER_PULL;
    n.vy-=n.y*CENTER_PULL;
    n.vx*=DAMPING;n.vy*=DAMPING;
    n.x+=n.vx;n.y+=n.vy;
  }
}

// ── DRAW ──
function worldToScreen(wx,wy){
  return{x:(wx+camX)*zoom+W/2,y:(wy+camY)*zoom+H/2};
}
function screenToWorld(sx,sy){
  return{x:(sx-W/2)/zoom-camX,y:(sy-H/2)/zoom-camY};
}

function drawGraph(){
  ctx.clearRect(0,0,W,H);

  // Edges
  for(const e of edges){
    const a=worldToScreen(nodes[e.a].x,nodes[e.a].y);
    const b=worldToScreen(nodes[e.b].x,nodes[e.b].y);
    const alpha=BOOKS[e.a].sub===BOOKS[e.b].sub?0.18:0.06;
    ctx.strokeStyle=`rgba(255,255,255,${alpha})`;
    ctx.lineWidth=BOOKS[e.a].sub===BOOKS[e.b].sub?0.8:0.4;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }

  // Nodes
  for(let i=0;i<N;i++){
    const n=nodes[i];
    const s=worldToScreen(n.x,n.y);
    const isHov=hoveredNode===i;
    const isSel=selectedNode===i;
    const col=CAT_COLORS[n.book.cat]||'#888';
    const r=(isSel?9:isHov?8:5)*Math.max(0.5,Math.min(zoom,2));

    // glow on hover/select
    if(isHov||isSel){
      const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*3);
      g.addColorStop(0,col+'55');g.addColorStop(1,'transparent');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(s.x,s.y,r*3,0,Math.PI*2);ctx.fill();
    }

    // circle
    ctx.fillStyle=isSel||isHov?col:col+'99';
    ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill();

    // ring for selected
    if(isSel){
      ctx.strokeStyle=col;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(s.x,s.y,r+4,0,Math.PI*2);ctx.stroke();
    }

    // label — show on hover or if zoomed in enough, or selected
    if(isHov||isSel||(zoom>1.4&&r>4)){
      const label=n.book.title;
      ctx.font=`${isSel?12:10}px 'Courier New',monospace`;
      ctx.textAlign='left';
      const metrics=ctx.measureText(label);
      const lx=s.x+r+5,ly=s.y+4;
      // bg box
      ctx.fillStyle='rgba(13,13,13,0.85)';
      ctx.fillRect(lx-3,ly-11,metrics.width+6,16);
      ctx.fillStyle=isSel?'rgba(255,255,255,0.9)':isHov?'rgba(255,255,255,0.75)':'rgba(255,255,255,0.45)';
      ctx.fillText(label,lx,ly);
    }
  }

  // Counter
  document.getElementById('counter').textContent=`${N} entries`;
}

// ── ANIMATION LOOP ──
let simSteps=0;
function loop(){
  if(simSteps<400)simulate();
  simSteps++;
  drawGraph();
  requestAnimationFrame(loop);
}
loop();

// ── INTERACTION ──
function getNodeAt(sx,sy){
  const w=screenToWorld(sx,sy);
  let best=null,bestD=Infinity;
  for(let i=0;i<N;i++){
    const n=nodes[i];
    const dx=n.x-w.x,dy=n.y-w.y;
    const hitR=(12)/zoom;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<hitR&&d<bestD){bestD=d;best=i;}
  }
  return best;
}

canvas.addEventListener('mousemove',e=>{
  if(dragging){
    camX+=(e.clientX-lastMX)/zoom;
    camY+=(e.clientY-lastMY)/zoom;
    lastMX=e.clientX;lastMY=e.clientY;
    hoveredNode=null;canvas.className='dragging';
    return;
  }
  const hit=getNodeAt(e.clientX,e.clientY);
  hoveredNode=hit;
  canvas.className=hit!==null?'hovering':'';
});

canvas.addEventListener('mousedown',e=>{
  dragging=true;lastMX=e.clientX;lastMY=e.clientY;
});
window.addEventListener('mouseup',e=>{
  if(!dragging)return;
  const moved=Math.abs(e.clientX-lastMX)+Math.abs(e.clientY-lastMY);
  dragging=false;
  if(moved<5){
    const hit=getNodeAt(e.clientX,e.clientY);
    if(hit!==null)openNode(hit);
  }
  canvas.className=hoveredNode!==null?'hovering':'';
});

// Touch
let touchStartX=0,touchStartY=0,touchDragged=false;
canvas.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;
  touchDragged=false;lastMX=touchStartX;lastMY=touchStartY;
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-lastMX,dy=e.touches[0].clientY-lastMY;
  camX+=dx/zoom;camY+=dy/zoom;
  lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;
  touchDragged=true;
},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!touchDragged){
    const t=e.changedTouches[0];
    const hit=getNodeAt(t.clientX,t.clientY);
    if(hit!==null)openNode(hit);
  }
});

// Wheel zoom
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY<0?1.1:0.91;
  const wx=(e.clientX-W/2)/zoom-camX;
  const wy=(e.clientY-H/2)/zoom-camY;
  zoom=Math.max(0.2,Math.min(6,zoom*factor));
  camX=(e.clientX-W/2)/zoom-wx;
  camY=(e.clientY-H/2)/zoom-wy;
},{passive:false});

document.getElementById('zoomIn').addEventListener('click',()=>{zoom=Math.min(6,zoom*1.2);});
document.getElementById('zoomOut').addEventListener('click',()=>{zoom=Math.max(0.2,zoom/1.2);});

// ── DETAIL CARD ──
let currentBookId=null;
function openNode(idx){
  const book=BOOKS[idx];
  selectedNode=idx;currentBookId=book.id;

  document.getElementById('dcCounter').innerHTML=`<span class="dc-dot" style="background:${CAT_COLORS[book.cat]};"></span>${book.id} / ${N}`;
  document.getElementById('dcTitle').textContent=book.title;
  document.getElementById('dcCat').textContent=`${book.cat} / ${book.sub}`;
  document.getElementById('dcAuthor').textContent=book.author==='N/A'?'':book.author;
  document.getElementById('dcTags').textContent=book.tags;

  // Related: same cat
  const related=BOOKS.filter(b=>b.cat===book.cat&&b.id!==book.id).slice(0,5);
  const relWrap=document.getElementById('dcRelated');
  relWrap.innerHTML=`<div class="dc-related-label">related</div>`;
  related.forEach(r=>{
    const t=document.createElement('span');t.className='dc-related-tag';t.textContent=r.title;
    t.addEventListener('click',()=>{const i=nodes.findIndex(n=>n.id===r.id);if(i>=0)openNode(i);});
    relWrap.appendChild(t);
  });

  // Loan button state
  const btn=document.getElementById('loanBtn');
  const onLoan=isOnLoan(book.title)||(sessionLoans[book.id]&&sessionLoans[book.id]>0);
  if(onLoan){btn.textContent='on loan';btn.classList.add('on-loan');btn.disabled=true;}
  else{btn.textContent='loan';btn.classList.remove('on-loan');btn.disabled=false;}
  document.getElementById('loanModalTitle').textContent=book.title;

  // Pan camera to node
  const n=nodes[idx];
  camX=-n.x+(window.innerWidth>600?-100:0)/zoom;
  camY=-n.y;

  document.getElementById('detailCard').classList.add('open');
}

document.getElementById('dcClose').addEventListener('click',()=>{
  document.getElementById('detailCard').classList.remove('open');
  selectedNode=null;currentBookId=null;
});

// ── LOAN MODAL ──
document.getElementById('loanBtn').addEventListener('click',()=>{
  if(document.getElementById('loanBtn').disabled)return;
  document.getElementById('loanError').textContent='';
  document.getElementById('codeInput').value='';
  document.getElementById('loanModal').classList.add('active');
});
document.getElementById('loanCancel').addEventListener('click',()=>document.getElementById('loanModal').classList.remove('active'));
document.getElementById('loanConfirm').addEventListener('click',async()=>{
  const book=BOOKS.find(b=>b.id===currentBookId);if(!book)return;
  const code=document.getElementById('codeInput').value.trim().toLowerCase();
  const err=document.getElementById('loanError');
  const btn=document.getElementById('loanConfirm');
  if(!VALID_CODES.includes(code)){err.textContent='invalid code.';return;}
  const ex=sessionLoans[book.id]||0;
  if(ex>=MAX_LOANS){err.textContent='limit reached.';return;}
  sessionLoans[book.id]=(ex||0)+1;
  btn.textContent='sending...';btn.disabled=true;err.textContent='';
  try{
    if(window.emailjs){
      await emailjs.send(EMAILJS_SERVICE,EMAILJS_TEMPLATE,{
        'user-name':CODE_NAMES[code]||code,
        'book_title':book.title,
        'book_author':book.author==='N/A'?'':book.author,
      });
    }
  }catch(e){console.error(e);}
  btn.textContent='loan';btn.disabled=false;
  document.getElementById('loanModal').classList.remove('active');
  // Update button in card
  const lb=document.getElementById('loanBtn');
  lb.textContent='on loan';lb.classList.add('on-loan');lb.disabled=true;
});

// ── LEGEND ──
const leg=document.getElementById('legend');
Object.entries(CAT_COLORS).forEach(([cat,col])=>{
  leg.innerHTML+=`<div class="leg-item"><div class="leg-dot" style="background:${col}"></div><div class="leg-label">${cat.toLowerCase()}</div></div>`;
});

});
document.getElementById('adminCodeInput').addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.getElementById('adminPortal').classList.remove('open');return;}
  if(e.key==='Enter'){
    if(document.getElementById('adminCodeInput').value.trim()===_b){
      window.location.href='admin.html';
    }else{
      document.getElementById('adminCodeError').textContent='incorrect.';
      document.getElementById('adminCodeInput').value='';
    }
  }
});
