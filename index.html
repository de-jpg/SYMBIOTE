*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#0d0d0d;overflow:hidden;font-family:'Courier New',Courier,monospace;}
canvas{position:fixed;inset:0;display:block;}
/* Hide default cursor */
body{cursor:none;}

#counter{position:fixed;top:16px;left:16px;font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:0.1em;z-index:10;pointer-events:none;}
#zoomBtns{position:fixed;top:44px;left:16px;display:flex;flex-direction:column;gap:5px;z-index:10;}
.zoom-btn{width:32px;height:32px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);font-size:16px;cursor:none;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background 0.2s;pointer-events:all;}
.zoom-btn:hover{background:rgba(255,255,255,0.12);}

/* DETAIL CARD - centered */
#detailCard{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.94);
  width:min(420px,90vw);
  max-height:85vh;
  background:#0f0f0f;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:2px;
  padding:32px 28px 24px;
  z-index:100;
  overflow-y:auto;
  display:flex;flex-direction:column;gap:0;
  opacity:0;pointer-events:none;
  transition:opacity 0.32s ease, transform 0.32s cubic-bezier(0.4,0,0.2,1);
}
#detailCard.open{opacity:1;pointer-events:all;transform:translate(-50%,-50%) scale(1);}
.dc-close{position:absolute;top:16px;right:18px;background:none;border:none;color:rgba(255,255,255,0.25);font-size:16px;cursor:none;font-family:'Courier New',monospace;transition:color 0.2s;pointer-events:all;}
.dc-close:hover{color:rgba(255,255,255,0.65);}
.dc-idx{font-size:8px;color:rgba(255,255,255,0.2);letter-spacing:0.14em;margin-bottom:18px;}
.dc-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;}
.dc-title{font-size:19px;color:rgba(255,255,255,0.9);font-weight:normal;line-height:1.3;margin-bottom:5px;}
.dc-cat{font-size:8px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.25);margin-bottom:12px;}
.dc-author{font-size:11px;color:rgba(255,255,255,0.42);margin-bottom:12px;}
.dc-tags{font-size:10px;color:rgba(255,255,255,0.35);line-height:1.85;margin-bottom:20px;}
.dc-related{margin-bottom:20px;}
.dc-rel-label{font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.18);margin-bottom:7px;}
.dc-rel-tag{display:inline-block;font-size:8.5px;color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.09);padding:3px 8px;border-radius:1px;margin:2px 2px 0 0;cursor:none;transition:all 0.15s;pointer-events:all;}
.dc-rel-tag:hover{border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.8);}
.dc-actions{display:flex;gap:8px;margin-top:4px;}
.loan-btn{flex:1;background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.55);font-family:'Courier New',monospace;font-size:10px;padding:9px 14px;border-radius:1px;cursor:none;letter-spacing:0.1em;transition:all 0.2s;pointer-events:all;}
.loan-btn:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.35);color:rgba(255,255,255,0.85);}
.loan-btn.on-loan{border-color:rgba(160,60,60,0.4);color:rgba(200,80,80,0.7);}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-4px);}40%{transform:translateX(4px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
.goodreads-btn{flex:1;background:transparent;border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.3);font-family:'Courier New',monospace;font-size:10px;padding:9px 14px;border-radius:1px;text-decoration:none;display:flex;align-items:center;justify-content:center;letter-spacing:0.08em;transition:all 0.2s;}
.goodreads-btn:hover{border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);}

/* DIM OVERLAY */
#dimOverlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0);pointer-events:none;transition:background 0.35s ease;}
#dimOverlay.on{background:rgba(0,0,0,0.72);pointer-events:all;}

/* LOAN MODAL */
#loanModal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.93);align-items:center;justify-content:center;}
#loanModal.active{display:flex;}
.loan-box{background:#0d0d0d;border:1px solid rgba(255,255,255,0.07);border-radius:2px;padding:26px 28px;width:min(290px,88vw);}
.loan-box h3{font-size:11px;font-weight:normal;color:rgba(255,255,255,0.72);margin-bottom:4px;}
.loan-box p{font-size:9px;color:rgba(255,255,255,0.22);margin-bottom:13px;}
.loan-box input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);font-family:'Courier New',monospace;font-size:13px;padding:9px 11px;border-radius:1px;margin-bottom:6px;outline:none;}
.loan-box input:focus{border-color:rgba(255,255,255,0.26);}
.loan-box input::placeholder{color:rgba(255,255,255,0.15);}
.loan-row-btns{display:flex;gap:6px;margin-top:7px;}
.loan-confirm{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.7);font-family:'Courier New',monospace;font-size:10px;padding:9px;border-radius:1px;cursor:none;pointer-events:all;}
.loan-confirm:hover{background:rgba(255,255,255,0.12);}
.loan-cancel{background:transparent;border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.22);font-family:'Courier New',monospace;font-size:10px;padding:9px 12px;border-radius:1px;cursor:none;pointer-events:all;}
.loan-error{font-size:9px;color:#a06060;margin-top:4px;min-height:13px;}

#legend{position:fixed;bottom:18px;left:16px;z-index:10;pointer-events:none;}
.leg-item{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.leg-dot{width:7px;height:7px;border-radius:50%;}
.leg-label{font-size:8.5px;color:rgba(255,255,255,0.2);letter-spacing:0.08em;}

#siteTitle{position:fixed;bottom:18px;right:18px;font-size:9px;letter-spacing:0.2em;color:rgba(255,255,255,0.12);font-family:'Courier New',monospace;cursor:none;z-index:10;pointer-events:all;transition:color 0.2s;}
#siteTitle:hover{color:rgba(255,255,255,0.38);}

#adminPortal{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.97);align-items:center;justify-content:center;}
#adminPortal.open{display:flex;}
.admin-wrap{text-align:center;}
.admin-label{font-size:8px;letter-spacing:0.2em;color:#222;margin-bottom:13px;}
#adminIn{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.65);font-family:'Courier New',monospace;font-size:19px;letter-spacing:0.3em;text-align:center;outline:none;width:130px;padding:5px 0;}
#adminErr{font-size:8px;color:#a06060;margin-top:7px;min-height:11px;}
</style>

const BOOKS=RAW.map((b,i)=>({id:i+1,...b}));
const N=BOOKS.length;

// ── CANVAS SETUP ──
const gc=document.getElementById('graphCanvas');
const uc=document.getElementById('uiCanvas');
const gx=gc.getContext('2d');
const ux=uc.getContext('2d');
let W,H;
function resize(){W=gc.width=uc.width=window.innerWidth;H=gc.height=uc.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();

// ── NODE SETUP ──
// Spread initial positions by category to avoid serial explosion
const CAT_CENTERS={
  "History":    {x:-300,y:-200},
  "Theory":     {x:-100,y:-300},
  "Monographs": {x:200,y:-200},
  "Typologies": {x:100,y:200},
  "Technical":  {x:-250,y:200},
  "Serials":    {x:300,y:100},
};
const nodes=BOOKS.map((b,i)=>{
  const c=CAT_CENTERS[b.cat]||{x:0,y:0};
  return{id:b.id,book:b,
    x:c.x+(Math.random()-0.5)*220,
    y:c.y+(Math.random()-0.5)*220,
    vx:0,vy:0};
});

// Topic hub nodes (special large nodes)
const topicNodes=TOPICS.map((t,i)=>{
  const cats=t.cats;
  const c=CAT_CENTERS[cats[0]]||{x:0,y:0};
  return{...t,x:c.x+(Math.random()-0.5)*80,y:c.y+(Math.random()-0.5)*80,vx:0,vy:0,isTopic:true};
});

// EDGES: same sub only (fixes serials going crazy)
const edges=[];
for(let i=0;i<N;i++){
  for(let j=i+1;j<N;j++){
    if(BOOKS[i].sub===BOOKS[j].sub){
      edges.push({a:i,b:j,strong:true});
    }
  }
}
// Cross-cat edges: books sharing a tag keyword
const TAG_BRIDGES=[
  ['modernism','Modern','modern'],
  ['urban','urbanism','Urban','city'],
  ['housing','residential','Residential'],
  ['structure','Structure','foundation'],
];
for(const kwds of TAG_BRIDGES){
  const matches=[];
  for(let i=0;i<N;i++){
    if(kwds.some(k=>BOOKS[i].tags.toLowerCase().includes(k.toLowerCase())||BOOKS[i].sub.toLowerCase().includes(k.toLowerCase()))){
      matches.push(i);
    }
  }
  // Connect pairs across different categories only
  for(let a=0;a<matches.length;a++){
    for(let b=a+1;b<matches.length;b++){
      if(BOOKS[matches[a]].cat!==BOOKS[matches[b]].cat){
        edges.push({a:matches[a],b:matches[b],strong:false,cross:true});
      }
    }
  }
}
// Topic hub edges
for(const tn of topicNodes){
  for(let i=0;i<N;i++){
    const b=BOOKS[i];
    const tagLow=(b.tags+' '+b.sub+' '+b.title).toLowerCase();
    const match=tn.tags.some(t=>tagLow.includes(t.toLowerCase()));
    if(match&&tn.cats.includes(b.cat)){
      edges.push({a:i,b:'T_'+tn.id,topic:true});
    }
  }
}

// ── PHYSICS ──
const REPEL=2800,ATTRACT=0.016,DAMPING=0.78,CENTER=0.003;
function simulate(){
  const allN=[...nodes,...topicNodes];
  const nAll=allN.length;
  // Repulsion
  for(let i=0;i<nAll;i++){
    for(let j=i+1;j<nAll;j++){
      const a=allN[i],b=allN[j];
      const dx=a.x-b.x,dy=a.y-b.y;
      const d2=Math.max(dx*dx+dy*dy,1);
      const f=REPEL/d2;
      const inv=1/Math.sqrt(d2);
      a.vx+=dx*inv*f;a.vy+=dy*inv*f;
      b.vx-=dx*inv*f;b.vy-=dy*inv*f;
    }
  }
  // Attraction
  for(const e of edges){
    let a,b;
    if(typeof e.a==='number')a=nodes[e.a];
    else a=topicNodes.find(t=>t.id===e.a);
    if(typeof e.b==='number')b=nodes[e.b];
    else b=topicNodes.find(t=>t.id===e.b);
    if(!a||!b)continue;
    const dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)+0.01;
    const ideal=e.strong?70:e.cross?350:120;
    const f=(d-ideal)*ATTRACT*(e.strong?2:e.cross?0.3:1);
    const nx=dx/d,ny=dy/d;
    a.vx+=nx*f;a.vy+=ny*f;
    b.vx-=nx*f;b.vy-=ny*f;
  }
  for(const n of allN){
    n.vx-=n.x*CENTER;n.vy-=n.y*CENTER;
    n.vx*=DAMPING;n.vy*=DAMPING;
    n.x+=n.vx;n.y+=n.vy;
  }
}

// ── CAMERA ──
let camX=0,camY=0,zoom=0.9;
function w2s(wx,wy){return{x:(wx+camX)*zoom+W/2,y:(wy+camY)*zoom+H/2};}
function s2w(sx,sy){return{x:(sx-W/2)/zoom-camX,y:(sy-H/2)/zoom-camY};}

// ── CURSOR ──
let mouseX=W/2,mouseY=H/2,mouseWorld={x:0,y:0};
let isDragging=false,lastMX=0,lastMY=0,dragMoved=false;
let hoveredNode=null,selectedNode=null,hoveredTopic=null;

window.addEventListener('mousemove',e=>{
  mouseX=e.clientX;mouseY=e.clientY;
  mouseWorld=s2w(mouseX,mouseY);
  if(isDragging){
    camX+=(e.clientX-lastMX)/zoom;camY+=(e.clientY-lastMY)/zoom;
    lastMX=e.clientX;lastMY=e.clientY;dragMoved=true;
  }
});

// ── INTRO ANIMATION ──
// Phase 0: letters grid → Phase 1: letters shrink to dots → Phase 2: graph
const PHASE_DUR=[2200,1200]; // ms per phase
let introPhase=0,introT=0,introStart=Date.now();
let introLetters=[];
let introActive=true;

// Generate grid of first letters
(function initIntro(){
  const cols=Math.ceil(Math.sqrt(N*1.6));
  const rows=Math.ceil(N/cols)+2;
  const spacingX=Math.min(W/(cols+1),55);
  const spacingY=Math.min(H/(rows+1),55);
  const startX=(W-spacingX*(cols-1))/2;
  const startY=(H-spacingY*(rows-1))/2;
  // Shuffle books for grid placement
  const shuffled=[...BOOKS].sort(()=>Math.random()-0.5);
  shuffled.forEach((b,i)=>{
    const col=i%cols,row=Math.floor(i/cols);
    const gx_=startX+col*spacingX+(Math.random()-0.5)*8;
    const gy_=startY+row*spacingY+(Math.random()-0.5)*8;
    // Compute world target
    const ni=nodes.findIndex(n=>n.id===b.id);
    const special=(b.author.includes('Josiah Prince Gomez'));
    introLetters.push({
      char:b.title[0].toUpperCase(),
      screenX:gx_,screenY:gy_,
      nodeIdx:ni,
      special,
      alpha:0,
    });
  });
})();

function drawIntro(now){
  const elapsed=now-introStart;
  gx.clearRect(0,0,W,H);
  ux.clearRect(0,0,W,H);

  if(introPhase===0){
    // Letters fade in then hold
    const t=Math.min(elapsed/PHASE_DUR[0],1);
    introLetters.forEach(l=>{
      l.alpha=Math.min(l.alpha+0.04,1);
      gx.font=`${14}px 'Courier New',monospace`;
      gx.textAlign='center';
      gx.fillStyle=l.special?`rgba(220,60,60,${l.alpha})`:`rgba(255,255,255,${l.alpha*0.55})`;
      gx.fillText(l.char,l.screenX,l.screenY);
    });
    if(elapsed>PHASE_DUR[0]){introPhase=1;introStart=now;}
  } else if(introPhase===1){
    // Transition: letters shrink, move to world positions
    const t=Math.min(elapsed/PHASE_DUR[1],1);
    const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    introLetters.forEach(l=>{
      const ni=l.nodeIdx;
      if(ni<0)return;
      const target=w2s(nodes[ni].x,nodes[ni].y);
      const cx=l.screenX+(target.x-l.screenX)*ease;
      const cy=l.screenY+(target.y-l.screenY)*ease;
      const sz=14*(1-ease*0.85);
      const al=(1-ease*0.7)*0.55;
      const r=ease*4;
      if(sz>2){
        gx.font=`${sz}px 'Courier New',monospace`;
        gx.textAlign='center';
        gx.fillStyle=l.special?`rgba(220,60,60,${al})`:`rgba(255,255,255,${al})`;
        gx.fillText(l.char,cx,cy);
      }
      // dot appearing
      if(ease>0.4){
        const da=(ease-0.4)/0.6;
        const col=CAT_COLORS[BOOKS[ni].cat]||'#888';
        gx.fillStyle=l.special?`rgba(220,60,60,${da})`:`${col}${Math.round(da*160).toString(16).padStart(2,'0')}`;
        gx.beginPath();gx.arc(cx,cy,Math.max(r,1.5),0,Math.PI*2);gx.fill();
      }
    });
    if(t>=1){introPhase=2;introActive=false;}
  }
}

// ── DRAW GRAPH ──
function drawGraph(){
  gx.clearRect(0,0,W,H);

  // Edges
  for(const e of edges){
    if(e.topic)continue; // topic edges drawn separately
    let a,b;
    if(typeof e.a==='number')a=nodes[e.a];else continue;
    if(typeof e.b==='number')b=nodes[e.b];else continue;
    const sa=w2s(a.x,a.y),sb=w2s(b.x,b.y);
    const al=e.strong?0.15:e.cross?0.04:0.08;
    gx.strokeStyle=`rgba(255,255,255,${al})`;
    gx.lineWidth=e.strong?0.7:0.3;
    gx.beginPath();gx.moveTo(sa.x,sa.y);gx.lineTo(sb.x,sb.y);gx.stroke();
  }

  // Topic hub edges
  for(const e of edges){
    if(!e.topic||typeof e.a!=='number')continue;
    const a=nodes[e.a];
    const tn=topicNodes.find(t=>t.id===e.b);
    if(!tn)continue;
    const sa=w2s(a.x,a.y),sb=w2s(tn.x,tn.y);
    gx.strokeStyle='rgba(255,255,255,0.06)';
    gx.lineWidth=0.4;
    gx.beginPath();gx.moveTo(sa.x,sa.y);gx.lineTo(sb.x,sb.y);gx.stroke();
  }

  // Book nodes
  for(let i=0;i<N;i++){
    const n=nodes[i];
    const s=w2s(n.x,n.y);
    if(s.x<-20||s.x>W+20||s.y<-20||s.y>H+20)continue;
    const isHov=hoveredNode===i,isSel=selectedNode===i;
    const col=CAT_COLORS[n.book.cat]||'#888';
    const r=(isSel?8:isHov?7:4.5)*Math.min(zoom,1.4);
    if(isHov||isSel){
      const g=gx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*4);
      g.addColorStop(0,col+'44');g.addColorStop(1,'transparent');
      gx.fillStyle=g;gx.beginPath();gx.arc(s.x,s.y,r*4,0,Math.PI*2);gx.fill();
    }
    gx.fillStyle=isSel||isHov?col:col+'a0';
    gx.beginPath();gx.arc(s.x,s.y,r,0,Math.PI*2);gx.fill();
    if(isSel){gx.strokeStyle=col;gx.lineWidth=1.5;gx.beginPath();gx.arc(s.x,s.y,r+5,0,Math.PI*2);gx.stroke();}
    if(isHov||isSel){
      const label=n.book.title;
      gx.font=`${isSel?12:10}px 'Courier New',monospace`;
      gx.textAlign='left';
      const tw=gx.measureText(label).width;
      const lx=s.x+r+6,ly=s.y+4;
      gx.fillStyle='rgba(10,10,10,0.88)';
      gx.fillRect(lx-3,ly-11,tw+6,16);
      gx.fillStyle=isSel?'rgba(255,255,255,0.92)':'rgba(255,255,255,0.78)';
      gx.fillText(label,lx,ly);
    }
  }

  // Topic hub nodes
  for(const tn of topicNodes){
    const s=w2s(tn.x,tn.y);
    if(s.x<-20||s.x>W+20||s.y<-20||s.y>H+20)continue;
    const isHovT=hoveredTopic===tn.id;
    const col='rgba(255,255,255,0.55)';
    const r=10*Math.min(zoom,1.4);
    // outer ring glow
    const g=gx.createRadialGradient(s.x,s.y,r,s.x,s.y,r*3.5);
    g.addColorStop(0,'rgba(255,255,255,0.12)');g.addColorStop(1,'transparent');
    gx.fillStyle=g;gx.beginPath();gx.arc(s.x,s.y,r*3.5,0,Math.PI*2);gx.fill();
    // ring
    gx.strokeStyle=isHovT?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.3)';
    gx.lineWidth=1.2;
    gx.beginPath();gx.arc(s.x,s.y,r,0,Math.PI*2);gx.stroke();
    // dot center
    gx.fillStyle=isHovT?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.25)';
    gx.beginPath();gx.arc(s.x,s.y,r*0.3,0,Math.PI*2);gx.fill();
    // label above
    gx.font=`10px 'Courier New',monospace`;
    gx.textAlign='center';
    gx.fillStyle=isHovT?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.4)';
    gx.fillText(tn.label,s.x,s.y-r-7);
  }
}

// ── CURSOR LINES (UI canvas) ──
const CURSOR_R=5;
const LINE_REACH=180;
const LINE_COUNT=5;

function drawCursor(){
  ux.clearRect(0,0,W,H);
  if(!introActive){
    // Find nearest nodes and draw lines
    const candidates=[];
    for(let i=0;i<N;i++){
      const s=w2s(nodes[i].x,nodes[i].y);
      const d=Math.hypot(s.x-mouseX,s.y-mouseY);
      if(d<LINE_REACH)candidates.push({i,d,s});
    }
    candidates.sort((a,b)=>a.d-b.d);
    const nearest=candidates.slice(0,LINE_COUNT);
    for(const c of nearest){
      const alpha=0.18*(1-c.d/LINE_REACH);
      ux.strokeStyle=`rgba(255,255,255,${alpha})`;
      ux.lineWidth=0.6;
      ux.beginPath();ux.moveTo(mouseX,mouseY);ux.lineTo(c.s.x,c.s.y);ux.stroke();
      // small dot at node end
      ux.fillStyle=`rgba(255,255,255,${alpha*1.5})`;
      ux.beginPath();ux.arc(c.s.x,c.s.y,1.5,0,Math.PI*2);ux.fill();
    }
  }
  // Cursor dot
  ux.fillStyle='rgba(255,255,255,0.9)';
  ux.beginPath();ux.arc(mouseX,mouseY,CURSOR_R,0,Math.PI*2);ux.fill();
  ux.strokeStyle='rgba(255,255,255,0.3)';
  ux.lineWidth=1;
  ux.beginPath();ux.arc(mouseX,mouseY,CURSOR_R+3,0,Math.PI*2);ux.stroke();
}

// ── MAIN LOOP ──
let simSteps=0;
function loop(){
  const now=Date.now();
  if(introActive){
    drawIntro(now);
  } else {
    if(simSteps<500)simulate();
    simSteps++;
    drawGraph();
    // Hover detection
    const wm=s2w(mouseX,mouseY);
    const HR=14/zoom;
    let bestN=null,bestD=Infinity;
    for(let i=0;i<N;i++){
      const d=Math.hypot(nodes[i].x-wm.x,nodes[i].y-wm.y);
      if(d<HR&&d<bestD){bestD=d;bestN=i;}
    }
    hoveredNode=bestN;
    // Topic hover
    const TR=18/zoom;
    let bestT=null,bestTD=Infinity;
    for(const tn of topicNodes){
      const d=Math.hypot(tn.x-wm.x,tn.y-wm.y);
      if(d<TR&&d<bestTD){bestTD=d;bestT=tn.id;}
    }
    hoveredTopic=bestT;
    gc.style.cursor='none';
    document.getElementById('counter').textContent=`${N} entries`;
  }
  drawCursor();
  requestAnimationFrame(loop);
}
loop();

window.addEventListener('mouseup',e=>{
  if(!isDragging)return;
  isDragging=false;
  if(!dragMoved){
    if(hoveredNode!==null){openNode(hoveredNode);return;}
    if(hoveredTopic!==null){/* filter or highlight topic */return;}
  }
  dragMoved=false;
});

window.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.1:0.91;
  const wx=(e.clientX-W/2)/zoom-camX,wy=(e.clientY-H/2)/zoom-camY;
  zoom=Math.max(0.15,Math.min(7,zoom*f));
  camX=(e.clientX-W/2)/zoom-wx;camY=(e.clientY-H/2)/zoom-wy;
},{passive:false});

let tSX=0,tSY=0,tDrag=false;
uc.addEventListener('touchstart',e=>{tSX=e.touches[0].clientX;tSY=e.touches[0].clientY;tDrag=false;lastMX=tSX;lastMY=tSY;},{passive:true});
uc.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-lastMX,dy=e.touches[0].clientY-lastMY;
  camX+=dx/zoom;camY+=dy/zoom;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;tDrag=true;
  mouseX=e.touches[0].clientX;mouseY=e.touches[0].clientY;
},{passive:true});
uc.addEventListener('touchend',e=>{
  if(!tDrag){
    const t=e.changedTouches[0];
    const wm=s2w(t.clientX,t.clientY);
    const HR=20/zoom;
    for(let i=0;i<N;i++){
      if(Math.hypot(nodes[i].x-wm.x,nodes[i].y-wm.y)<HR){openNode(i);return;}
    }
  }
});

document.getElementById('zoomIn').addEventListener('click',()=>zoom=Math.min(7,zoom*1.25));
document.getElementById('zoomOut').addEventListener('click',()=>zoom=Math.max(0.15,zoom/1.25));

let currentBookId=null;
const sessionLoans={};
function loadLoans(){try{return JSON.parse(localStorage.getItem(LOANS_KEY)||'[]');}catch{return[];}}
function isOnLoan(title){
  return loadLoans().some(l=>{
    const due=new Date(l.date);due.setDate(due.getDate()+14);
    const now=new Date();now.setHours(0,0,0,0);due.setHours(0,0,0,0);
    return l.title===title&&Math.round((due-now)/86400000)>0;
  });
}

function openNode(idx){
  const book=BOOKS[idx];
  selectedNode=idx;currentBookId=book.id;
  document.getElementById('dcIdx').innerHTML=`<span class="dc-dot" style="background:${CAT_COLORS[book.cat]||'#888'}"></span>${book.id} / ${N}`;
  document.getElementById('dcTitle').textContent=book.title;
  document.getElementById('dcCat').textContent=`${book.cat} / ${book.sub}`;
  document.getElementById('dcAuthor').textContent=book.author==='N/A'?'':book.author;
  document.getElementById('dcTags').textContent=book.tags;
  // Related
  const rel=BOOKS.filter(b=>b.sub===book.sub&&b.id!==book.id).slice(0,6);
  const rw=document.getElementById('dcRelated');
  rw.innerHTML=`<div class="dc-rel-label">same collection</div>`;
  rel.forEach(r=>{
    const t=document.createElement('span');t.className='dc-rel-tag';t.textContent=r.title;
    t.addEventListener('click',()=>{const i=nodes.findIndex(n=>n.id===r.id);if(i>=0)openNode(i);});
    rw.appendChild(t);
  });
  // Loan btn
  const lb=document.getElementById('loanBtn');
  const onLoan=isOnLoan(book.title)||sessionLoans[book.id];
  lb.textContent=onLoan?'on loan':'loan';
  lb.className=onLoan?'loan-btn on-loan':'loan-btn';
  lb.disabled=!!onLoan;
  // Goodreads
  const gr=document.getElementById('goodreadsBtn');
  const q=encodeURIComponent((book.title+' '+book.author).replace('N/A',''));
  gr.href=`https://www.goodreads.com/search?q=${q}`;
  document.getElementById('loanModalTitle').textContent=book.title;
  // Pan to node
  const n=nodes[idx];
  camX=-n.x;camY=-n.y;
  document.getElementById('dimOverlay').classList.add('on');
  document.getElementById('detailCard').classList.add('open');
}

function closeCard(){
  document.getElementById('detailCard').classList.remove('open');
  document.getElementById('dimOverlay').classList.remove('on');
  selectedNode=null;currentBookId=null;
}
document.getElementById('dcClose').addEventListener('click',closeCard);
document.getElementById('dimOverlay').addEventListener('click',closeCard);

// ── LOAN ──
document.getElementById('loanBtn').addEventListener('click',()=>{
  if(document.getElementById('loanBtn').disabled)return;
  document.getElementById('loanError').textContent='';
  document.getElementById('codeInput').value='';
  document.getElementById('loanModal').classList.add('active');
});
document.getElementById('loanCancel').addEventListener('click',()=>document.getElementById('loanModal').classList.remove('active'));
document.getElementById('loanConfirm').addEventListener('click',async()=>{
  const book=BOOKS.find(b=>b.id===currentBookId);if(!book)return;
  const code=document.getElementById('codeInput').value.trim().toLowerCase();
  const err=document.getElementById('loanError');
  const btn=document.getElementById('loanConfirm');
  if(!VALID_CODES.includes(code)){err.textContent='invalid code.';return;}
  if(sessionLoans[book.id]){err.textContent='already loaned.';return;}
  sessionLoans[book.id]=true;
  btn.textContent='sending...';btn.disabled=true;err.textContent='';
  try{
    if(window.emailjs)await emailjs.send(EMAILJS_SERVICE,EMAILJS_TEMPLATE,{'user-name':CODE_NAMES[code]||code,'book_title':book.title,'book_author':book.author==='N/A'?'':book.author});
  }catch(e){console.error(e);}
  btn.textContent='loan';btn.disabled=false;
  document.getElementById('loanModal').classList.remove('active');
  const lb=document.getElementById('loanBtn');
  lb.textContent='on loan';lb.classList.add('on-loan');lb.disabled=true;
});

// ── LEGEND ──
const leg=document.getElementById('legend');
Object.entries(CAT_COLORS).forEach(([cat,col])=>{
  leg.innerHTML+=`<div class="leg-item"><div class="leg-dot" style="background:${col}"></div><div class="leg-label">${cat.toLowerCase()}</div></div>`;
});
leg.innerHTML+=`<div class="leg-item"><div class="leg-dot" style="border:1px solid rgba(255,255,255,0.3);background:transparent;"></div><div class="leg-label">topic cluster</div></div>`;

// ── ADMIN ──
document.getElementById('siteTitle').addEventListener('click',()=>{
  document.getElementById('adminPortal').classList.add('open');
  document.getElementById('adminIn').value='';document.getElementById('adminErr').textContent='';
  setTimeout(()=>document.getElementById('adminIn').focus(),50);
});
document.getElementById('adminPortal').addEventListener('click',e=>{if(e.target===document.getElementById('adminPortal'))document.getElementById('adminPortal').classList.remove('open');});
document.getElementById('adminIn').addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.getElementById('adminPortal').classList.remove('open');return;}
  if(e.key==='Enter'){
    if(document.getElementById('adminIn').value.trim()===_b){window.location.href='admin.html';}
    else{document.getElementById('adminErr').textContent='incorrect.';document.getElementById('adminIn').value='';}
  }
});

window.addEventListener('load',()=>{if(window.emailjs)emailjs.init({publicKey:EMAILJS_PUBLIC});});
</script>
</body>
